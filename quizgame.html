<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b14;--surface:#0d1220;--card:#111827;--card2:#161f30;
  --border:#1e2d45;--border2:#2a3f5f;
  --violet:#7c3aed;--cyan:#06b6d4;--emerald:#10b981;
  --amber:#f59e0b;--rose:#ef4444;--pink:#ec4899;
  --text:#e8f0fe;--muted:#64748b;--subtle:#374151;
  --gv:rgba(124,58,237,.5);--gc:rgba(6,182,212,.4);--ge:rgba(16,185,129,.4);
  --gar:rgba(239,68,68,.4);
  --r:16px;--r2:12px;--r3:8px;
  --trans:.22s cubic-bezier(.4,0,.2,1);
  --font:'Be Vietnam Pro',sans-serif;
}
.light{
  --bg:#f0f4ff;--surface:#e4eaf8;--card:#fff;--card2:#f8faff;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#0f172a;--muted:#64748b;--subtle:#e2e8f0;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;font-size:15px;line-height:1.6}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}

/* ── SCREENS ── */
.screen{width:100%;max-width:580px;animation:screenIn .45s cubic-bezier(.4,0,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.screen-out{animation:screenOut .25s ease forwards!important}
@keyframes screenOut{to{opacity:0;transform:translateY(-16px)}}

/* ── GLASS ── */
.glass{background:rgba(13,18,32,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r)}
.light .glass{background:rgba(255,255,255,.88)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--r2);border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:14px;transition:var(--trans);position:relative;overflow:hidden;white-space:nowrap}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.06);opacity:0;transition:opacity .18s;border-radius:inherit}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.96)!important}
.btn-violet{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 4px 18px var(--gv)}
.btn-violet:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--gv)}
.btn-cyan{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff;box-shadow:0 4px 18px var(--gc)}
.btn-cyan:hover{transform:translateY(-2px)}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 18px var(--ge)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--violet);background:rgba(124,58,237,.07)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:var(--r3)}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:9px;width:38px;height:38px;border-radius:var(--r3);flex-shrink:0}
.btn-full{width:100%;padding:13px}
.btn:disabled{opacity:.4;pointer-events:none}

/* ── INPUTS ── */
.inp{width:100%;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s}
.light .inp{background:rgba(255,255,255,.85)}
.inp:focus{border-color:var(--violet)}
.inp::placeholder{color:var(--muted)}
select.inp option{background:var(--surface);color:var(--text)}
label.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}

/* ── ANSWER OPTIONS ── */
.opt{width:100%;padding:13px 16px;border-radius:var(--r2);border:1.5px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;text-align:left;font-family:var(--font);font-size:14px;font-weight:500;color:var(--text);transition:all .2s;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.light .opt{background:rgba(255,255,255,.7)}
.opt:hover:not(.opt-disabled){border-color:var(--violet);background:rgba(124,58,237,.07);transform:translateX(4px)}
.opt.opt-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.12)!important;box-shadow:0 0 18px var(--ge);animation:correctPop .4s cubic-bezier(.34,1.56,.64,1)}
.opt.opt-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.12)!important;animation:shake .38s ease}
.opt.opt-reveal{border-color:var(--emerald)!important;background:rgba(16,185,129,.06)!important}
.opt.opt-elim{opacity:.25;pointer-events:none;text-decoration:line-through}
.opt.opt-disabled{pointer-events:none}
.opt-key{min-width:30px;height:30px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .2s;flex-shrink:0}
.opt-correct .opt-key{background:var(--emerald);color:#fff}
.opt-wrong .opt-key{background:var(--rose);color:#fff}
@keyframes correctPop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ── PROGRESS BAR ── */
.pbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ── TIMER CIRCLE ── */
.timer-wrap{position:relative;width:62px;height:62px;flex-shrink:0}
.timer-svg{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--border);stroke-width:5}
.timer-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;font-size:17px}

/* ── STREAK ── */
.streak{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;transition:all .3s;border:1px solid transparent}
.streak-0{color:var(--muted);border-color:var(--border)}
.streak-1{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.streak-2{color:#f97316;border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.1);animation:gpulse 1.6s infinite}
.streak-3{color:#ef4444;border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1);animation:gpulse .9s infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 12px rgba(239,68,68,.25)}50%{box-shadow:0 0 24px rgba(239,68,68,.55)}}

/* ── FREEZE ── */
.freeze-overlay{position:absolute;inset:0;border-radius:var(--r);background:rgba(6,182,212,.04);border:2px solid rgba(6,182,212,.35);pointer-events:none;animation:fpulse 2s ease infinite;z-index:5}
@keyframes fpulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── CONFETTI ── */
.conf{position:fixed;pointer-events:none;z-index:999;top:-14px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.5);opacity:0}}

/* ── SCORE RING ── */
.score-ring{position:relative;width:110px;height:110px;margin:0 auto}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── MISC ── */
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.divider{height:1px;background:var(--border);width:100%}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag-mcq{background:rgba(124,58,237,.2);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.tag-tf{background:rgba(6,182,212,.2);color:#67e8f9;border:1px solid rgba(6,182,212,.3)}
.tag-tnl{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}

/* ── SHORT ANSWER INPUT ── */
.sa-wrap{position:relative;margin-top:4px}
.sa-inp{width:100%;padding:14px 50px 14px 16px;border-radius:var(--r2);border:2px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s;resize:none;min-height:52px}
.light .sa-inp{background:rgba(255,255,255,.85)}
.sa-inp:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.sa-inp::placeholder{color:var(--muted)}
.sa-inp.sa-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.1)!important;box-shadow:0 0 16px var(--ge)}
.sa-inp.sa-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.1)!important;animation:shake .38s ease}
.sa-send{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--trans);font-size:16px}
.sa-send:hover{transform:translateY(-50%) scale(1.08);box-shadow:0 4px 14px var(--gv)}
.sa-send:disabled{opacity:.3;pointer-events:none}
.sa-result-box{margin-top:10px;padding:12px 14px;border-radius:var(--r3);font-size:14px;font-weight:600}
.sa-result-ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.sa-result-bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.sa-img-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:6px;border:1.5px dashed var(--border2);transition:var(--trans)}
.sa-img-label:hover{border-color:var(--cyan);color:var(--cyan)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.fade-row{animation:fadeRow .32s ease forwards}
@keyframes fadeRow{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── Q TRANSITION ── */
.q-new{animation:qNew .35s cubic-bezier(.4,0,.2,1)}
@keyframes qNew{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}

/* ── RESULT ITEMS ── */
.res-item{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--r3);border:1px solid var(--border)}
.res-ok{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)}
.res-bad{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06)}
.res-skip{border-color:var(--border);opacity:.6}

/* ── HINT BUBBLE ── */
.hint-box{padding:10px 14px;border-radius:var(--r3);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);font-size:13px;color:#fbbf24;animation:fadeRow .28s ease}

/* ── TOGGLE ── */
.toggle{display:flex;background:var(--border);border-radius:var(--r3);padding:3px;gap:3px}
.toggle .topt{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--trans);color:var(--muted)}
.toggle .topt.active{background:var(--violet);color:#fff;box-shadow:0 2px 8px var(--gv)}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r2);padding:22px;text-align:center;cursor:pointer;transition:var(--trans);position:relative}
.upload-zone:hover{border-color:var(--cyan);background:rgba(6,182,212,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:460px;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ── PRACTICE BADGE ── */
.practice-q{padding:12px 14px;border-radius:var(--r3);border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.07);margin-bottom:8px}

/* ── LOGO ── */
.logo-text{font-size:38px;font-weight:800;background:linear-gradient(135deg,#a78bfa 0%,#67e8f9 55%,#6ee7b7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  #app{padding:8px}
  .opt{padding:11px 13px;font-size:13px}
  .glass{border-radius:var(--r2)}
  .logo-text{font-size:30px}
}

/* ── STAT CARD ── */
.stat-card{border-radius:var(--r2);padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:800;font-family:var(--font)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* ── IMAGE LIGHTBOX ── */
.img-zoomable{cursor:zoom-in;transition:opacity .18s,transform .18s;border-radius:var(--r3)}
.img-zoomable:hover{opacity:.88;transform:scale(1.02)}
.lightbox-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;cursor:zoom-out}
.lightbox-inner{position:relative;max-width:min(92vw,900px);max-height:92vh;animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
.lightbox-img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.7);display:block}
.lightbox-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--rose);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(239,68,68,.5);transition:transform .15s}
.lightbox-close:hover{transform:scale(1.12)}

.lightbox-zoom-bar button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s}

/* ── RICH TEXT display (bold/italic/newline in questions) ── */
.rich-text strong{font-weight:800;color:var(--text)}
.rich-text em{font-style:italic;color:#c4b5fd}
.rich-text u{text-decoration:underline;text-underline-offset:3px}
.rich-text br{display:block;content:'';margin-top:4px}

/* ── RICH TEXT EDITOR (create screen) ── */
.rte-wrap{position:relative;margin-bottom:9px}
.rte-toolbar{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;align-items:center}
.rte-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;padding:0}
.rte-btn:hover{background:rgba(124,58,237,.15);border-color:var(--violet);color:#a78bfa}
.rte-btn.active{background:rgba(124,58,237,.25);border-color:var(--violet);color:#a78bfa}
.rte-btn-b{font-weight:900}
.rte-btn-i{font-style:italic;font-weight:600}
.rte-btn-u{text-decoration:underline;font-weight:600}
.rte-hint{font-size:11px;color:var(--muted);padding:2px 7px;border-left:2px solid var(--border2)}
.rte-field{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;line-height:1.7;cursor:text;white-space:pre-wrap;word-break:break-word}
.light .rte-field{background:rgba(255,255,255,.85)}
.rte-field:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.rte-field[placeholder]:empty::before{content:attr(placeholder);color:var(--muted);pointer-events:none}
.rte-field strong{font-weight:800;color:var(--text)}
.rte-field em{font-style:italic;color:#c4b5fd}
.rte-field u{text-decoration:underline;text-underline-offset:3px}
.rte-preview{margin-top:5px;padding:7px 11px;border-radius:6px;background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.2);font-size:13px;color:var(--muted);display:none}
.rte-preview.has-fmt{display:block}
.rte-preview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-bottom:3px}

/* ── CURSOR (colour-cycling dot + trailing ring) ── */
#cursor-dot,#cursor-ring{display:none}
@media (hover:hover) and (pointer:fine){
  html.has-cursor,html.has-cursor *{cursor:none!important}
  html.has-cursor input,html.has-cursor textarea,html.has-cursor [contenteditable],html.has-cursor .rte-field{cursor:text!important}
  #cursor-dot,#cursor-ring{--c:hsl(260,100%,62%);--cs:hsla(260,100%,62%,.12);display:block;position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;opacity:0;will-change:transform}
  #cursor-dot{z-index:10001;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--c);box-shadow:0 0 12px var(--c);transition:opacity .2s,width .2s,height .2s,margin .2s}
  #cursor-ring{z-index:10000;width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--c);transition:opacity .2s,width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),margin .25s cubic-bezier(.2,.8,.2,1),background .25s}
  #cursor-ring.hover{width:64px;height:64px;margin:-32px 0 0 -32px;background:var(--cs)}
  #cursor-ring.down{width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--cs)}
  #cursor-dot.down{width:5px;height:5px;margin:-2.5px 0 0 -2.5px}
}

/* ── BACKGROUND: aurora layer (canvas sits above it) ── */
#bg-aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.34;mix-blend-mode:screen;will-change:transform}
#bg-aurora i:nth-child(1){left:-18vmax;top:-20vmax;background:radial-gradient(circle,#7c3aed,transparent 66%);animation:aur1 24s ease-in-out infinite alternate}
#bg-aurora i:nth-child(2){right:-22vmax;top:8vmax;background:radial-gradient(circle,#06b6d4,transparent 66%);animation:aur2 28s ease-in-out infinite alternate}

@keyframes aur1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,10vmax) scale(1.18)}100%{transform:translate(6vmax,22vmax) scale(.92)}}
@keyframes aur2{0%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-20vmax,12vmax) scale(.9)}100%{transform:translate(-8vmax,-6vmax) scale(1.2)}}
@keyframes aur3{0%{transform:translate(0,0) scale(.95)}50%{transform:translate(20vmax,-14vmax) scale(1.2)}100%{transform:translate(-10vmax,-6vmax) scale(1)}}
.light #bg-aurora i{opacity:.2;mix-blend-mode:multiply}
@media(max-width:600px){#bg-aurora i{filter:blur(48px);opacity:.28}}

/* ── CAT MASCOT ── */
.cat-stage{position:relative;display:inline-block;margin-bottom:8px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.cat-wrap{transform-origin:50% 100%;filter:drop-shadow(0 8px 18px rgba(245,158,11,.4));animation:catIn .95s cubic-bezier(.34,1.56,.64,1) both,catBob 3.4s ease-in-out .95s infinite}
.cat-wrap svg{display:block;overflow:visible}
@keyframes catIn{0%{opacity:0;transform:translateY(46px) scale(.25) rotate(-14deg)}60%{opacity:1;transform:translateY(-9px) scale(1.08) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes catBob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.018)}}
.cat-jump{animation:catJump .75s cubic-bezier(.3,1.3,.5,1)}
@keyframes catJump{0%{transform:none}25%{transform:translateY(-28px) scale(.94,1.08)}55%{transform:translateY(0) scale(1.1,.88)}78%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:none}}
.cat-tail{transform-origin:100px 112px;animation:catTail 1.7s ease-in-out infinite}
@keyframes catTail{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(15deg)}}
.cat-head{transform-origin:70px 92px;animation:catHead 6s ease-in-out infinite}
@keyframes catHead{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.cat-ear-l{transform-origin:52px 40px;animation:catEarL 5.2s infinite}
.cat-ear-r{transform-origin:88px 40px;animation:catEarR 6.4s infinite}
@keyframes catEarL{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-13deg)}94%{transform:rotate(3deg)}97%{transform:rotate(-5deg)}}
@keyframes catEarR{0%,80%,100%{transform:rotate(0)}83%{transform:rotate(13deg)}86%{transform:rotate(-3deg)}89%{transform:rotate(4deg)}}
.cat-eye{transform-box:fill-box;transform-origin:center;animation:catBlink 4.6s infinite}
@keyframes catBlink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
.cat-pupil{transition:transform .12s ease-out}
.cat-bubble{position:absolute;left:calc(100% + 2px);top:4px;width:max-content;max-width:min(150px,calc(50vw - 66px));padding:6px 12px;border-radius:14px 14px 14px 4px;background:var(--card);border:1px solid var(--border2);color:var(--text);font-size:12px;font-weight:600;line-height:1.4;text-align:left;opacity:0;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cat-bubble.show{animation:catBubble 3.4s ease both}
.cat-bubble.first{animation-delay:1.2s}
@keyframes catBubble{0%{opacity:0;transform:translateY(6px) scale(.8)}10%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.cat-wrap,.cat-tail,.cat-head,.cat-ear-l,.cat-ear-r,.cat-eye{animation:none!important}}

<script>
/* ── Hộp thoại tự làm (thay confirm/alert của trình duyệt — bị chặn khi chạy trong iframe/preview) ── */
function _uiDialog(msg,buttons){
  const bg=document.createElement('div');
  bg.className='modal-bg';bg.style.zIndex='9500';
  const box=document.createElement('div');box.className='modal';box.style.maxWidth='380px';
  const p=document.createElement('p');
  p.style.cssText='font-size:15px;line-height:1.6;white-space:pre-line;margin-bottom:18px';
  p.textContent=msg;
  const row=document.createElement('div');row.style.cssText='display:flex;gap:10px';
  box.appendChild(p);box.appendChild(row);bg.appendChild(box);document.body.appendChild(bg);
  buttons.forEach(b=>{
    const el=document.createElement('button');
    el.className='btn btn-full '+b.cls;el.textContent=b.label;
    el.onclick=()=>{bg.remove();if(b.fn)b.fn();};
    row.appendChild(el);
  });
}
window.uiConfirm=(msg,onYes)=>_uiDialog(msg,[{label:'Hủy',cls:'btn-ghost'},{label:'Đồng ý',cls:'btn-violet',fn:onYes}]);
window.alert=(msg)=>{_uiDialog(String(msg),[{label:'OK',cls:'btn-violet'}]);};
/* ═══════════════════════════════════════════════════════
   QUIZ MASTER — Full Single File
   ═══════════════════════════════════════════════════════ */

/* ── SOUND ENGINE ── */
const AC = window.AudioContext ? new (window.AudioContext||window.webkitAudioContext)() : null;
function tone(freq,type='sine',dur=.15,vol=.22){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
const SFX={
  click:()=>tone(480,'sine',.07,.16),
  correct:()=>{tone(523,'sine',.1);setTimeout(()=>tone(659,'sine',.1),95);setTimeout(()=>tone(784,'sine',.17),190)},
  wrong:()=>{tone(200,'sawtooth',.11,.26);setTimeout(()=>tone(155,'sawtooth',.16,.26),100)},
  streak:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.12),i*72)),
  tick:()=>tone(880,'square',.05,.09),
  whoosh:()=>{tone(300,'sine',.05,.09);setTimeout(()=>tone(750,'sine',.07,.07),45)},
  end:()=>[523,587,659,698,784].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.14),i*95)),
};

SFX.meow=()=>{
  if(!AC)return;
  try{
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='triangle';o.connect(g);g.connect(AC.destination);
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(920,t+.12);
    o.frequency.exponentialRampToValueAtTime(420,t+.4);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.42);
    o.start(t);o.stop(t+.45);
  }catch(e){}
};

/* ── STORAGE ENGINE ──
   In-memory store is the single source of truth.
   localStorage is best-effort persistence, split per-set to avoid quota.
   ─────────────────────────────────────────────────────────── */

/* Question Sets in-memory master list */
const _QS_MEM = { list: null };

const QS = {
  _load() {
    if (_QS_MEM.list !== null) return;
    /* Try new per-key format */
    try {
      const idxRaw = localStorage.getItem('qs_index');
      if (idxRaw) {
        const idx = JSON.parse(idxRaw);
        const list = [];
        for (const meta of idx) {
          try {
            const raw = localStorage.getItem(meta.key);
            if (raw) {
              list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: JSON.parse(raw) });
            } else if (meta._noStorage) {
              /* Questions quá lớn không lưu được — vẫn giữ bộ đề với questions rỗng
                 để người dùng biết nó tồn tại và có thể xóa/thêm lại */
              list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: [] });
            } else {
              /* key không tìm thấy — vẫn tạo entry rỗng để không mất slot */
              list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: [] });
            }
          } catch (_) {}
        }
        _QS_MEM.list = list;
        return;
      }
    } catch (_) {}
    /* Fallback legacy */
    try {
      const raw = localStorage.getItem('question_sets');
      _QS_MEM.list = raw ? JSON.parse(raw) : [];
    } catch { _QS_MEM.list = []; }
  },

  getAll() { this._load(); return _QS_MEM.list; },

  _persist() {
    const list = _QS_MEM.list;
    /* Xóa các key cũ */
    try {
      const oldIdx = JSON.parse(localStorage.getItem('qs_index') || '[]');
      for (const m of oldIdx) { try { localStorage.removeItem(m.key); } catch (_) {} }
    } catch (_) {}
    /* Xóa hết key qs_N cũ có thể còn sót */
    for (let k = 0; k < 20; k++) { try { localStorage.removeItem('qs_' + k); } catch (_) {} }

    const idx = [];
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const key = 'qs_' + i;
      const meta = { name: s.name, timePerQ: s.timePerQ || 20, hints: s.hints || 3, key };
      /* Thử lưu questions đầy đủ */
      let saved = false;
      try {
        localStorage.setItem(key, JSON.stringify(s.questions));
        saved = true;
      } catch (_) {
        /* Quota đầy — thử lưu phiên bản không có ảnh */
        try {
          const lite = s.questions.map(q => {
            const c = Object.assign({}, q);
            if (c.image && c.image.length > 200) c.image = '';
            if (c.optImages) c.optImages = c.optImages.map(x => (x && x.length > 200) ? '' : x);
            if (c.subQuestions) c.subQuestions = c.subQuestions.map(sq => {
              const sc = Object.assign({}, sq);
              if (sc.image && sc.image.length > 200) sc.image = '';
              return sc;
            });
            return c;
          });
          localStorage.setItem(key, JSON.stringify(lite));
          saved = true;
        } catch (_2) {}
      }
      /* Dù có lưu được questions hay không, vẫn đẩy meta vào idx
         để bộ đề không bị mất khỏi danh sách khi reload */
      idx.push(meta);
      if (!saved) {
        /* Đánh dấu để khi load biết questions không có trong storage */
        idx[idx.length - 1]._noStorage = true;
      }
    }
    try { localStorage.setItem('qs_index', JSON.stringify(idx)); } catch (_) {}
    try { localStorage.removeItem('question_sets'); } catch (_) {}
  },

  upsert(ns) {
    this._load();
    const ei = _QS_MEM.list.findIndex(s => s.name === ns.name);
    if (ei >= 0) _QS_MEM.list[ei] = ns; else _QS_MEM.list.push(ns);
    this._persist();
  },

  remove(i) {
    this._load();
    _QS_MEM.list.splice(i, 1);
    this._persist();
  },

  update(i, ns) {
    this._load();
    _QS_MEM.list[i] = ns;
    this._persist();
  },
};

/* ── localStorage quota check ── */
function _lsQuotaOk(){
  try{
    const t='__qtest__';
    localStorage.setItem(t,'1');
    localStorage.removeItem(t);
    return true;
  }catch(_){return false;}
}

/* ── localStorage wrapper (non-question-set keys) ── */
const _LS_MEM = {};
const LS = {
  get(k, d) {
    if (k === 'question_sets') return QS.getAll();
    if (k in _LS_MEM) return _LS_MEM[k];
    try { const v = localStorage.getItem(k); const p = v != null ? JSON.parse(v) : d; _LS_MEM[k] = p; return p; }
    catch { return d; }
  },
  set(k, v) {
    if (k === 'question_sets') { QS._load(); _QS_MEM.list = v; QS._persist(); return; }
    _LS_MEM[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {}
  },
};

/* ── APP STATE ── */
const S={
  screen:'menu',
  darkMode:LS.get('darkMode',true),
  // game
  questions:[],config:{timePerQ:20,hints:3,name:''},
  idx:0,score:0,streak:0,bestStreak:LS.get('best_streak',0),
  timeLeft:0,frozen:false,answered:false,
  selected:null,eliminated:[],hintsLeft:0,
  startTime:0,elapsed:0,results:[],
  currentHint:'',timerID:null,
  saInput:'',saImg:'',saCorrect:false,
  // practice
  practiceList:[],
  // modal
  modal:null, // 'config-default'
  modalData:{},
};

/* ── DEFAULT QUESTIONS ── */
const DEFAULT_QS=[
  {id:1,type:'mcq',question:'Thủ đô của Việt Nam là gì?',options:['Hà Nội','Hồ Chí Minh','Đà Nẵng','Huế'],answer:0,hint:'Thành phố nghìn năm văn hiến ở miền Bắc'},
  {id:2,type:'tf',question:'Trái Đất quay quanh vật thể nào?',options:['Mặt Trăng','Sao Hỏa','Mặt Trời','Sao Thổ'],answer:2,hint:'Vật thể trung tâm của hệ Mặt Trời'},
  {id:3,type:'mcq',question:'Ký hiệu hóa học của Vàng là gì?',options:['Go','Au','Ag','Gd'],answer:1,hint:'Bắt nguồn từ tiếng Latin "Aurum"'},
  {id:4,type:'mcq',question:'Năm nào Việt Nam thống nhất đất nước?',options:['1973','1974','1975','1976'],answer:2,hint:'Sự kiện 30/4 lịch sử'},
  {id:5,type:'tf',question:'Python thuộc loại ngôn ngữ nào?',options:['Biên dịch','Thông dịch','Máy móc','Hợp ngữ'],answer:1,hint:'Python chạy qua trình thông dịch (interpreter)'},

/* ── CANVAS BG: particles + hue-cycling orbs + cursor interaction + shooting stars ── */
(function initBG(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,particles=[],shoots=[],nextShoot=1500;
  const mouse={x:-9999,y:-9999,sx:-9999,sy:-9999,on:false};
  const orbHues=[265,190,160,330];
  const orbs=orbHues.map(h=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:180+Math.random()*140,h}));

  function newParticle(){
    const vx=(Math.random()-.5)*.42,vy=(Math.random()-.5)*.42;
    return{x:Math.random()*W,y:Math.random()*H,bvx:vx,bvy:vy,vx,vy,r:Math.random()*2+.6,a:.35+Math.random()*.65,
      tw:Math.random()*6.28,ts:.0008+Math.random()*.0018,tint:Math.random()<.22,ho:Math.random()*80-40};
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const want=Math.round(Math.min(110,Math.max(32,W*H/15000)));
    while(particles.length<want)particles.push(newParticle());
    if(particles.length>want)particles.length=want;
    particles.forEach(p=>{if(p.x>W)p.x=Math.random()*W;if(p.y>H)p.y=Math.random()*H;});
  }
  resize();window.addEventListener('resize',resize);

  /* pointer tracking (mouse + touch) */
  window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(!mouse.on){mouse.on=true;mouse.sx=mouse.x;mouse.sy=mouse.y;}},{passive:true});
  window.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')mouse.on=false;},{passive:true});
  document.addEventListener('mouseleave',()=>{mouse.on=false;});
  /* click / tap → shockwave pushes particles away */
  window.addEventListener('pointerdown',e=>{
    mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;
    if(mouse.sx<-999){mouse.sx=mouse.x;mouse.sy=mouse.y;}
    particles.forEach(p=>{
      const dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.hypot(dx,dy);
      if(d<280&&d>1){const f=(1-d/280)*7;p.vx+=dx/d*f;p.vy+=dy/d*f;}
    });
  },{passive:true});

  function spawnShoot(){
    const fromLeft=Math.random()<.5;
    const sp=9+Math.random()*6, ang=(Math.PI/180)*(25+Math.random()*20);
    shoots.push({x:fromLeft?Math.random()*W*.5:W*.5+Math.random()*W*.5,y:-20+Math.random()*H*.35,
      vx:Math.cos(ang)*sp*(fromLeft?1:-1),vy:Math.sin(ang)*sp,len:90+Math.random()*90,life:1});
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);
    const isDark=!document.body.classList.contains('light');
    const hs=(now*.008)%360;   /* global hue drift, full cycle ≈ 45s */

    /* cursor spotlight */
    if(mouse.on){
      mouse.sx+=(mouse.x-mouse.sx)*.09;mouse.sy+=(mouse.y-mouse.sy)*.09;
      const g=ctx.createRadialGradient(mouse.sx,mouse.sy,0,mouse.sx,mouse.sy,280);
      g.addColorStop(0,`hsla(${hs},100%,60%,${isDark?.13:.07})`);g.addColorStop(1,`hsla(${hs},100%,60%,0)`);
      ctx.fillStyle=g;ctx.fillRect(mouse.sx-280,mouse.sy-280,560,560);
    }

    /* orbs (hue shifts over time) */
    orbs.forEach(o=>{
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
      if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
      const hh=(o.h+hs)%360;
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`hsla(${hh},85%,60%,${isDark?.12:.07})`);g.addColorStop(1,`hsla(${hh},85%,60%,0)`);
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });

    /* particles */
    for(const p of particles){
      if(mouse.on){
        const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
        if(d<130&&d>.5){const f=(1-d/130)*.55;p.vx+=dx/d*f;p.vy+=dy/d*f;}
      }
      p.vx+=(p.bvx-p.vx)*.025;p.vy+=(p.bvy-p.vy)*.025;
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const tw=.6+.4*Math.sin(now*p.ts+p.tw);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.85+.3*tw),0,Math.PI*2);
      if(p.tint)ctx.fillStyle=`hsla(${(hs+p.ho+360)%360},95%,${isDark?72:45}%,${p.a*tw*(isDark?.85:.55)})`;
      else ctx.fillStyle=isDark?`rgba(180,200,255,${p.a*.55*tw})`:`rgba(80,100,140,${p.a*.3*tw})`;
      ctx.fill();
    }

    /* connecting lines */
    ctx.lineWidth=.7;
    for(let i=0;i<particles.length;i++){
      const a=particles[i];
      for(let j=i+1;j<particles.length;j++){
        const b=particles[j],dx=a.x-b.x,dy=a.y-b.y;
        if(dx>120||dx<-120||dy>120||dy<-120)continue;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          const al=isDark?.18*(1-d/120):.1*(1-d/120);
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
          ctx.strokeStyle=isDark?`rgba(140,160,220,${al})`:`rgba(100,120,180,${al})`;ctx.stroke();
        }
      }
      if(mouse.on){
        const dx=a.x-mouse.x,dy=a.y-mouse.y,d=Math.hypot(dx,dy);
        if(d<160){
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);
          ctx.strokeStyle=`hsla(${hs},100%,${isDark?68:45}%,${(isDark?.45:.3)*(1-d/160)})`;ctx.lineWidth=.9;ctx.stroke();ctx.lineWidth=.7;
        }
      }
    }

    /* shooting stars */
    if(!reduce){
      if(now>nextShoot){spawnShoot();nextShoot=now+2800+Math.random()*4200;}
      for(let i=shoots.length-1;i>=0;i--){
        const s=shoots[i];
        s.x+=s.vx;s.y+=s.vy;s.life-=.012;
        const m=Math.hypot(s.vx,s.vy),tx=s.x-s.vx/m*s.len,ty=s.y-s.vy/m*s.len;
        const g=ctx.createLinearGradient(s.x,s.y,tx,ty);
        g.addColorStop(0,`hsla(${hs},100%,${isDark?85:50}%,${Math.max(s.life,0)*(isDark?.95:.6)})`);
        g.addColorStop(1,`hsla(${hs},100%,70%,0)`);
        ctx.strokeStyle=g;ctx.lineWidth=1.8;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(tx,ty);ctx.stroke();
        if(s.life<=0||s.x<-200||s.x>W+200||s.y>H+200)shoots.splice(i,1);
      }
      ctx.lineCap='butt';
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

let _catLook=false;

  if(_catLook)return;_catLook=true;

    const r=st.getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.45);
    const d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*3.2;

function _doRender(){
  document.body.className=S.darkMode?'':'light';

  if(S.modal){renderModal();return;}
  switch(S.screen){
    case'menu':renderMenu();break;
    case'create':renderCreate();break;

    case'result':renderResult();break;

}

/* ── File Upload (chỉ nhận JSON) ── */
window.uploadFile=(e)=>{
  const f=e.target.files[0];if(!f)return;
  e.target.value='';
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext!=='json'){alert('❌ Chỉ nhận file .json!\nFile bạn chọn: '+f.name);return;}
  const r=new FileReader();
  r.onload=ev=>{
    let data;
    try{data=JSON.parse(String(ev.target.result).replace(/^\uFEFF/,''));}
    catch(pe){alert('❌ File JSON không hợp lệ!\nLỗi: '+pe.message);return;}
    const isObj=data&&typeof data==='object'&&!Array.isArray(data);
    const raw=Array.isArray(data)?data:(isObj&&Array.isArray(data.questions)?data.questions:[]);
    const qs=raw.filter(q=>q&&typeof q==='object'&&String(q.question||'').trim()).map((q,qi)=>({...q,id:q.id||qi+1}));
    if(!qs.length){alert('Không tìm thấy câu hỏi hợp lệ trong file!');return;}
    const setName=(isObj&&data.name)?String(data.name):f.name.replace(/\.json$/i,'').replace(/_/g,' ');
    QS.upsert({name:setName,questions:qs,timePerQ:(isObj&&data.timePerQ)||20,hints:(isObj&&data.hints)||3});
    SFX.correct();
    alert('✔️ Đã thêm bộ đề "'+setName+'" ('+qs.length+' câu)\nvào menu chơi!');
    render();
  };
  r.onerror=()=>alert('❌ Không thể đọc file. Vui lòng thử lại.');
  r.readAsText(f,'UTF-8');
};

/* Inject rich-text editor into a slot after DOM render */
function injectRTE(i,val){
  const slot=document.getElementById('cr-q-rte-'+i);
  if(!slot)return;
  // Build toolbar + contenteditable
  const id='rte-q-'+i;
  slot.innerHTML=`
    <div class="rte-wrap">
      <div class="rte-toolbar">
        <button type="button" class="rte-btn rte-btn-b" title="In đậm (Ctrl+B)" onmousedown="rteExec(event,'${id}','bold')"><b>B</b></button>
        <button type="button" class="rte-btn rte-btn-i" title="In nghiêng (Ctrl+I)" onmousedown="rteExec(event,'${id}','italic')"><i>I</i></button>
        <button type="button" class="rte-btn rte-btn-u" title="Gạch chân (Ctrl+U)" onmousedown="rteExec(event,'${id}','underline')"><u>U</u></button>
        <button type="button" class="rte-btn" title="Xuống dòng" onmousedown="rteExec(event,'${id}','br')" style="font-size:14px">↵</button>
        <span class="rte-hint">Ctrl+B · Ctrl+I · Ctrl+U · Enter xuống dòng</span>
      </div>
      <div class="rte-field" id="${id}" contenteditable="true" placeholder="Nội dung câu hỏi..."
        data-qi="${i}"
        oninput="rteOnInput('${id}',${i})"
        onkeydown="rteOnKey(event,'${id}',${i})"
        onpaste="rtePaste(event)"
      >${rawToEditable(val||'')}</div>
      <div class="rte-preview${hasFmt(val)?' has-fmt':''}" id="${id}-prev">
        <div class="rte-preview-label">Xem trước</div>
        <span class="rich-text">${richText(val||'')}</span>
      </div>
    </div>`;
}
window.rteExec=(ev,id,cmd)=>{
  ev.preventDefault();
  const el=document.getElementById(id);
  if(!el)return;
  el.focus();
  if(cmd==='bold')document.execCommand('bold',false,null);
  else if(cmd==='italic')document.execCommand('italic',false,null);
  else if(cmd==='underline')document.execCommand('underline',false,null);
  else if(cmd==='br')document.execCommand('insertHTML',false,'<br><br>');
  const qi=parseInt(el.getAttribute('data-qi'));
  rteFlush(id,qi);
};
window.rteOnKey=(e,id,qi)=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();document.execCommand('bold',false,null);rteFlush(id,qi);}
  if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();document.execCommand('italic',false,null);rteFlush(id,qi);}
  if((e.ctrlKey||e.metaKey)&&e.key==='u'){e.preventDefault();document.execCommand('underline',false,null);rteFlush(id,qi);}
  // Enter inserts <br> (default contenteditable behavior already handles this)
};
window.rteOnInput=(id,qi)=>{rteFlush(id,qi);};
window.rtePaste=(e)=>{
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,text);
};
function rteFlush(id,qi){
  const el=document.getElementById(id);
  if(!el)return;
  const raw=editableToRaw(el.innerHTML);
  CR.questions[qi].question=raw;
  // update preview
  const prev=document.getElementById(id+'-prev');
  if(prev){
    const span=prev.querySelector('.rich-text');
    if(span)span.innerHTML=richText(raw);
    prev.className='rte-preview'+(hasFmt(raw)?' has-fmt':'');
  }
}

window.crSetType=(i,t)=>{
  CR.questions[i].type=t;

    CR.questions[i].optImages=['',''];
    CR.questions[i].answer=0;
    // 4 sub-questions for Đ/S type
    if(!CR.questions[i].subQuestions){
      CR.questions[i].subQuestions=[
        {text:'',image:''},
        {text:'',image:''},
        {text:'',image:''},
        {text:'',image:''},
      ];
    }
    if(!CR.questions[i].subAnswers)CR.questions[i].subAnswers=[null,null,null,null];
  }
  else if(t==='mcq'){CR.questions[i].options=['','','',''];CR.questions[i].optImages=['','','',''];CR.questions[i].answer=0;}
  else if(t==='tnl'){CR.questions[i].options=[];CR.questions[i].optImages=[];CR.questions[i].answer='';CR.questions[i].answerAlt='';}
  renderCreate();
};
window.crSetField=(i,f,v)=>{

  else CR.questions[i][f]=v;
};

// Image upload for question
window.crUploadImg=(e,i)=>{

  const r=new FileReader();
  r.onload=ev=>{CR.questions[i].image=ev.target.result;renderCreate();};

window.crRemoveImg=(i)=>{CR.questions[i].image='';renderCreate();};

// Image upload for answer options
window.crUploadOptImg=(e,i,oi)=>{

window.crRemoveOptImg=(i,oi)=>{if(CR.questions[i].optImages)CR.questions[i].optImages[oi]='';renderCreate();};

// Đ/S sub-question helpers
window.crSetSubQ=(i,si,field,val)=>{

window.crSetSubAns=(i,si,val)=>{

window.crUploadSubImg=(e,i,si)=>{

// Export JSON (standalone button)
window.crExportJSON=()=>{
  const valid=CR.questions.filter(q=>q.question.trim());
  if(!valid.length){alert('Nhập ít nhất 1 câu hỏi!');return;}
  const payload={name:CR.name||'Bộ đề',timePerQ:CR.timePerQ||20,hints:CR.hints||3,questions:valid.map((q,i)=>({...q,id:i+1}))};
  _doExportJSON(payload);
  SFX.correct();
};

window.crSave=()=>{
  const valid=CR.questions.filter(q=>q.question.trim());
  if(!valid.length){alert('Nhập ít nhất 1 câu hỏi!');return;}
  const ns={name:CR.name||'Bộ đề',questions:valid.map((q,i)=>({...q,id:i+1})),timePerQ:CR.timePerQ||20,hints:CR.hints||3};
  if(CR.editIndex!=null){
    QS.update(CR.editIndex, ns);
    SFX.correct();
    startGame(ns.questions,{timePerQ:ns.timePerQ,hints:ns.hints,name:ns.name});
  } else {
    QS.upsert(ns);
    SFX.correct();
    initCR();
    startGame(ns.questions,{timePerQ:ns.timePerQ,hints:ns.hints,name:ns.name});
  }
};

function _doExportJSON(ns){
  const blob=new Blob([JSON.stringify(ns,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(ns.name||'bode').replace(/\s+/g,'_')+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

function startGame(questions,config){
  clearInterval(S.timerID);
  Object.assign(S,{
    questions,config,idx:0,score:0,streak:0,
    timeLeft:config.timePerQ,frozen:false,answered:false,
    selected:null,eliminated:[],hintsLeft:config.hintLimit?config.hints:999,
    startTime:Date.now(),elapsed:0,results:[],currentHint:'',
    bestStreak:LS.get('best_streak',0),practiceList:[],
    saInput:'',saImg:'',saCorrect:false,
    tfSubAnswers:[],
  });
  setScreen('game');
}

/* ── Game Logic ── */
function startTimer(){
  clearInterval(S.timerID);
  S.timerID=setInterval(()=>{
    if(S.answered||S.frozen)return;
    if(S.timeLeft<=3&&S.timeLeft>0)SFX.tick();
    S.timeLeft--;
    if(S.timeLeft<=0){clearInterval(S.timerID);onTimeout();}
    else updateTimerDOM();
  },1000);
}
function updateTimerDOM(){
  const t=S.timeLeft,tot=S.config.timePerQ;
  const pct=t/tot,R=26,CIRC=2*Math.PI*R;
  const col=pct>.5?'#10b981':pct>.25?'#f59e0b':'#ef4444';
  const n=document.querySelector('.timer-num'),fg=document.querySelector('.timer-fg');
  if(n){n.textContent=t;n.style.color=col;}
  if(fg){fg.style.stroke=col;fg.setAttribute('stroke-dashoffset',(CIRC*(1-pct)).toFixed(2));}
}
function onTimeout(){
  if(S.answered)return;
  S.answered=true;S.selected=-1;S.streak=0;SFX.wrong();
  const q=S.questions[S.idx];
  let answerDisplay;
  if(q.type==='tnl') answerDisplay=String(q.answer);
  else if(q.type==='tf'&&q.subQuestions) answerDisplay='Hết giờ';
  else answerDisplay=(q.options?q.options[q.answer]:'');
  S.results.push({q:q.question,correct:false,timed:true,answer:answerDisplay,obj:q});
  if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  renderGame();setTimeout(advance,1800);
}
window.selectOpt=(oi)=>{
  if(S.answered||S.frozen||S.eliminated.includes(oi))return;
  clearInterval(S.timerID);S.selected=oi;S.answered=true;
  const q=S.questions[S.idx],ok=oi===q.answer;
  if(ok){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    // add to practice list
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.results.push({q:q.question,correct:ok,skipped:false,answer:q.options[q.answer],obj:q});
  renderGame();setTimeout(advance,ok?1200:1800);
};

/* ── TNL: Short Answer ── */
window.submitSA=()=>{
  if(S.answered||S.frozen)return;
  const field=document.getElementById('sa-field');
  const input=(field?field.value:S.saInput).trim();
  if(!input){if(field){field.style.borderColor='var(--rose)';setTimeout(()=>{field.style.borderColor='';},600);}return;}
  clearInterval(S.timerID);
  const q=S.questions[S.idx];
  const normalize=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
  const userNorm=normalize(input);
  const ansNorm=normalize(q.answer);
  const altNorm=q.answerAlt?normalize(q.answerAlt):'';
  const ok=userNorm===ansNorm||(altNorm&&userNorm===altNorm);
  S.saInput=input;S.saCorrect=ok;S.answered=true;
  if(ok){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.results.push({q:q.question,correct:ok,skipped:false,answer:String(q.answer),userAnswer:input,obj:q});
  renderGame();setTimeout(advance,ok?1400:2200);
};
window.setSAImg=(e)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{S.saImg=ev.target.result;renderGame();setTimeout(()=>{const tf=document.getElementById('sa-field');if(tf)tf.focus();},50);};
  r.readAsDataURL(f);e.target.value='';
};
window.gameFreeze=()=>{if(S.answered)return;SFX.click();clearInterval(S.timerID);S.frozen=true;renderGame();};
window.gameResume=()=>{SFX.click();S.frozen=false;renderGame();startTimer();};
window.gameSkip=()=>{
  if(S.answered||S.frozen)return;
  SFX.click();clearInterval(S.timerID);
  const q=S.questions[S.idx];
  let answerDisplay;
  if(q.type==='tnl') answerDisplay=String(q.answer);
  else if(q.type==='tf'&&q.subQuestions) answerDisplay='Bỏ qua';
  else answerDisplay=(q.options?q.options[q.answer]:'');
  S.results.push({q:q.question,correct:false,skipped:true,answer:answerDisplay,obj:q});
  S.streak=0;
  if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  advance();
};
window.gameHint=()=>{
  if(S.hintsLeft<=0||S.answered||S.frozen)return;
  SFX.click();
  const q=S.questions[S.idx];
  if(q.hint&&!S.currentHint){S.currentHint=q.hint;S.hintsLeft--;renderGame();startTimer();return;}
  if(q.type==='tnl'){
    // For TNL: reveal first character as hint
    const ans=String(q.answer);
    S.currentHint='Chữ cái đầu tiên: "'+ans[0].toUpperCase()+'" · Độ dài: '+ans.length+' ký tự';
    S.hintsLeft--;renderGame();startTimer();return;
  }
  if(q.type==='tf'&&q.subQuestions&&q.subQuestions.length)return; // Đ/S nhiều ý: không có đáp án để loại
  const wrongs=q.options.map((_,i)=>i).filter(i=>i!==q.answer&&!S.eliminated.includes(i));
  const toEl=wrongs.slice(0,Math.min(2,Math.max(1,wrongs.length-1)));
  if(toEl.length){S.eliminated.push(...toEl);S.hintsLeft--;renderGame();startTimer();}
};
window.gameEnd=()=>{
  uiConfirm('Kết thúc game?',()=>{
    clearInterval(S.timerID);S.elapsed=Math.floor((Date.now()-S.startTime)/1000);setScreen('result');
  });
};
function advance(){
  clearInterval(S.timerID);S.currentHint='';
  if(S.idx+1>=S.questions.length){S.elapsed=Math.floor((Date.now()-S.startTime)/1000);setScreen('result');return;}
  S.idx++;S.timeLeft=S.config.timePerQ;S.answered=false;S.selected=null;S.eliminated=[];S.frozen=false;
  S.hintsLeft=S.config.hintLimit?S.config.hints:999;
  S.saInput='';S.saImg='';S.saCorrect=false;S.tfSubAnswers=[];
  renderGame();SFX.whoosh();
}

/* ── Đ/S sub-question game logic ── */
window.tfSelectSub=(si,val)=>{
  if(S.answered||S.frozen)return;
  if(!S.tfSubAnswers)S.tfSubAnswers=[];
  S.tfSubAnswers[si]=val;
  renderGame();
  // Re-focus timer (don't restart)
  const fg=document.querySelector('.timer-fg');
  if(fg){/* keep running */}
};
window.tfSubmit=()=>{
  if(S.answered||S.frozen)return;
  clearInterval(S.timerID);
  const q=S.questions[S.idx];
  const subs=q.subQuestions||[];
  const answers=q.subAnswers||[];
  const playerAnss=S.tfSubAnswers||[];
  // Count only sub-questions that have content AND have a defined answer
  const validSubs=subs.map((s,i)=>({s,i})).filter(({s,i})=>s.text&&answers[i]!==null&&answers[i]!==undefined);
  if(!validSubs.length){advance();return;}
  let correct=0;
  validSubs.forEach(({i})=>{
    if(playerAnss[i]===answers[i])correct++;
  });
  const allCorrect=correct===validSubs.length;
  if(allCorrect){
    SFX.correct();S.score++;S.streak++;
    if(S.streak>S.bestStreak){S.bestStreak=S.streak;LS.set('best_streak',S.streak);}
    if(S.streak>=3)SFX.streak();
  }else{
    SFX.wrong();S.streak=0;
    if(!S.practiceList.find(p=>p.id===q.id))S.practiceList.push(q);
  }
  S.answered=true;
  S.results.push({q:q.question,correct:allCorrect,skipped:false,answer:`${correct}/${validSubs.length} đúng`,obj:q});
  renderGame();
  setTimeout(advance,allCorrect?1400:2400);
};

window.prSubmitSA=()=>{
  if(PR.answered)return;
  const field=document.getElementById('pr-sa-field');
  const input=(field?field.value:'').trim();
  if(!input){if(field){field.style.borderColor='var(--rose)';setTimeout(()=>{field.style.borderColor='';},600);}return;}
  PR.answered=true;
  const q=S.practiceList[PR.idx];
  const normalize=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
  const ok=normalize(input)===normalize(q.answer)||(q.answerAlt&&normalize(input)===normalize(q.answerAlt));
  PR.saInput=input;PR.saCorrect=ok;
  if(ok){SFX.correct();PR.score++;}else{SFX.wrong();}
  PR.results.push({q:q.question,correct:ok,answer:String(q.answer)});
  renderPractice();
  setTimeout(()=>{
    if(PR.idx+1>=S.practiceList.length){showPracticeResult();return;}
    PR.idx++;PR.answered=false;PR.selected=null;PR.saInput='';PR.saCorrect=false;PR.frozen=false;PR.eliminated=[];PR.currentHint='';PR.showBaseHint=false;PR.tfHintRevealed=[];
    if(S.config&&S.config.hintLimit)PR.hintsLeft=S.config.hints;
    clearInterval(PR.timerID);renderPractice();SFX.whoosh();
  },ok?1400:2200);
};

/* ── Practice timer ── */
let _prTimerID=null;
function prSubAns(q,si){
  const a=q.subAnswers&&q.subAnswers[si];
  if(a===true||a===false)return a;
  const sq=q.subQuestions&&q.subQuestions[si];
  return(sq&&typeof sq.answer==='boolean')?sq.answer:null;
}
window.prTfSelectSub=(si,val)=>{
  if(PR.answered)return;
  if(!PR.tfSubAnswers)PR.tfSubAnswers=[];
  PR.tfSubAnswers[si]=val;
  renderPractice();
};
window.prTfSubmit=()=>{
  if(PR.answered)return;
  const q=S.practiceList[PR.idx];
  if(!q.subQuestions||!q.subQuestions.length)return;
  const playerAnss=PR.tfSubAnswers||[];
  const validIdx=q.subQuestions.map((_,si)=>si).filter(si=>{const sq=q.subQuestions[si];return(sq.text||sq.image||sq.question)&&prSubAns(q,si)!==null;});
  const allAnswered=validIdx.every(si=>playerAnss[si]!==undefined);
  if(!allAnswered){
    const btn=document.querySelector('.btn-violet');
    if(btn){btn.style.background='rgba(239,68,68,.3)';setTimeout(()=>{btn.style.background='';},600);}
    return;
  }
  PR.answered=true;
  let correctCount=0;
  validIdx.forEach(si=>{if(playerAnss[si]===prSubAns(q,si))correctCount++;});
  const allOk=correctCount===validIdx.length;
  if(allOk){SFX.correct();PR.score++;}else{SFX.wrong();}
  PR.results.push({q:q.question,correct:allOk,answer:'Đúng/Sai'});
  renderPractice();
  setTimeout(()=>{
    if(PR.idx+1>=S.practiceList.length){showPracticeResult();return;}
    PR.idx++;PR.answered=false;PR.selected=null;PR.saInput='';PR.saCorrect=false;
    PR.frozen=false;PR.eliminated=[];PR.currentHint='';PR.showBaseHint=false;PR.tfSubAnswers=[];PR.tfHintRevealed=[];
    if(S.config&&S.config.hintLimit)PR.hintsLeft=S.config.hints;
    clearInterval(_prTimerID);renderPractice();SFX.whoosh();
  },allOk?1400:2200);
};
function prStartTimer(){
  clearInterval(_prTimerID);
  // Practice mode has no time limit — just keep frozen state correct
}
window.prFreeze=()=>{
  if(PR.answered)return;
  SFX.click();clearInterval(_prTimerID);PR.frozen=true;renderPractice();
};
window.prResume=()=>{
  SFX.click();PR.frozen=false;renderPractice();prStartTimer();
};
window.prSkip=()=>{
  if(PR.answered||PR.frozen)return;
  SFX.click();clearInterval(_prTimerID);
  const q=S.practiceList[PR.idx];
  PR.results.push({q:q.question,correct:false,skipped:true,answer:''});
  PR.answered=true;
  PR.idx++;PR.answered=false;PR.selected=null;PR.saInput='';PR.saCorrect=false;
  PR.frozen=false;PR.eliminated=[];PR.currentHint='';PR.showBaseHint=false;PR.tfHintRevealed=[];
  if(PR.idx>=S.practiceList.length){showPracticeResult();return;}
  renderPractice();SFX.whoosh();
};
window.prHint=()=>{
  if(PR.answered||PR.frozen)return;
  if(PR.hintsLeft<=0)return;
  const q=S.practiceList[PR.idx];
  // 1. Show base hint text if exists and not shown yet (không tốn lượt)
  if(q.hint&&!PR.showBaseHint){
    PR.showBaseHint=true;
    SFX.click();renderPractice();return;
  }
  // 2. TNL: reveal first char (tốn 1 lượt)
  if(q.type==='tnl'){
    const ans=String(q.answer);
    const hint='Chữ cái đầu: "'+ans[0].toUpperCase()+'" · Độ dài: '+ans.length+' ký tự';
    if(PR.currentHint===hint)return; // đã hiện rồi, không tốn lượt
    PR.currentHint=hint;
    PR.hintsLeft--;SFX.click();renderPractice();return;
  }
  // 3. TF: hiện đáp án của 1 câu con chưa được tiết lộ (tốn 1 lượt)
  if(q.type==='tf'&&q.subQuestions&&q.subQuestions.length){
    if(!PR.tfHintRevealed)PR.tfHintRevealed=[];
    const unrevealed=q.subQuestions.map((_,i)=>i).filter(i=>!PR.tfHintRevealed.includes(i));
    if(!unrevealed.length)return; // hết câu để gợi ý
    PR.tfHintRevealed.push(unrevealed[0]);
    PR.hintsLeft--;SFX.click();renderPractice();return;
  }
  // 4. MCQ: loại bớt đáp án sai (tốn 1 lượt)
  if(q.options){
    const wrongs=q.options.map((_,i)=>i).filter(i=>i!==q.answer&&!PR.eliminated.includes(i));
    if(!wrongs.length)return; // hết đáp án sai để loại
    const toEl=wrongs.slice(0,Math.min(2,Math.max(1,wrongs.length-1)));
    PR.eliminated.push(...toEl);PR.hintsLeft--;SFX.click();renderPractice();
  }
};
function showPracticeResult(){
  const total=S.practiceList.length,pct=Math.round((PR.score/total)*100);
  if(pct>=80)setTimeout(()=>{launchConfetti();SFX.end();},200);
  const fc=pct>=80?'#10b981':pct>=50?'#f59e0b':'#ef4444';
  $app.innerHTML=`
  <div class="screen" style="max-width:480px;width:100%">
    <div class="glass" style="padding:26px;text-align:center">
      <div style="font-size:44px;margin-bottom:10px">${pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'💪'}</div>
      <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">Kết quả luyện tập</h2>
      <p style="font-size:28px;font-weight:800;color:${fc};margin:14px 0">${PR.score} / ${total}</p>
      <p style="font-size:15px;font-weight:600;color:var(--muted);margin-bottom:20px">${pct}% chính xác</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${pct<100?`<button class="btn btn-violet btn-full" onclick="retryPractice()">🔁 Ôn lại câu sai</button>`:''}
        <button class="btn btn-ghost btn-full" onclick="backFromPractice()">← Về kết quả</button>
        <button class="btn btn-ghost btn-full" onclick="goMenuFromResult()">🏠 Menu chính</button>
      </div>
    </div>
  </div>`;
}
window.retryPractice=()=>{
  S.practiceList=PR.results.filter(r=>!r.correct).map((r,i)=>S.practiceList.find(q=>q.question===r.q)||{question:r.q,id:i});
  if(!S.practiceList.length){alert('Bạn đã trả lời đúng tất cả! 🎉');backFromPractice();return;}
  PR={idx:0,score:0,answered:false,selected:null,saInput:'',saCorrect:false,results:[],tfSubAnswers:[],frozen:false,eliminated:[],hintsLeft:(S.config&&S.config.hintLimit)?S.config.hints:999,currentHint:'',showBaseHint:false,tfHintRevealed:[]};SFX.click();setScreen('practice');
};

/* ── Confetti ── */
function launchConfetti(){
  const cols=['#7c3aed','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#a78bfa','#67e8f9'];
  for(let i=0;i<65;i++){
    const el=document.createElement('div');el.className='conf';
    el.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*9}px;height:${6+Math.random()*9}px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${2+Math.random()*2.2}s;animation-delay:${Math.random()*1.8}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),(4.5+Math.random()*2)*1000);
  }
}

let _lbZoom=1;
window.openLightbox=(src)=>{
  _lbZoom=1;
  const lb=document.getElementById('lightbox');
  const img=document.getElementById('lb-img');
  const lbl=document.getElementById('lb-zoom-lbl');
  img.src=src;
  img.style.transform='scale(1)';
  if(lbl)lbl.textContent='100%';
  lb.style.display='flex';
  document.body.style.overflow='hidden';
};
window.closeLightbox=(e)=>{
  if(e&&e.target!==document.getElementById('lightbox')&&!e.target.classList.contains('lightbox-close'))return;
  document.getElementById('lightbox').style.display='none';
  document.body.style.overflow='';
};
window.lbZoom=(delta)=>{
  _lbZoom=Math.max(.2,Math.min(4,_lbZoom+delta));
  const img=document.getElementById('lb-img');
  const lbl=document.getElementById('lb-zoom-lbl');
  if(img)img.style.transform=`scale(${_lbZoom})`;
  if(lbl)lbl.textContent=Math.round(_lbZoom*100)+'%';
};
window.lbZoomReset=()=>{_lbZoom=1;lbZoom(0);};
// Keyboard: Esc to close, +/- to zoom
document.addEventListener('keydown',(e)=>{
  const lb=document.getElementById('lightbox');
  if(!lb||lb.style.display==='none')return;
  if(e.key==='Escape'){lb.style.display='none';document.body.style.overflow='';}
  if(e.key==='+'||e.key==='=')lbZoom(.2);
  if(e.key==='-')lbZoom(-.2);
});
// Mouse wheel zoom
document.getElementById('lightbox').addEventListener('wheel',(e)=>{
  e.preventDefault();
  lbZoom(e.deltaY<0?.15:-.15);
},{passive:false});

/* ══════════════════════════════════════════════════
   RICH TEXT EDITOR HELPERS
══════════════════════════════════════════════════ */

/* Convert stored raw text (with **bold** *italic* \n) → HTML for display */
function richText(s){
  if(s==null)return'';
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
    .replace(/__(.+?)__/g,'<u>$1</u>')
    .replace(/\\n|\n/g,'<br>');
}

/* Convert stored raw text → innerHTML for contenteditable */
function rawToEditable(s){
  if(!s)return'';
  // Escape HTML but keep structure
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+?)\*/g,'<em>$1</em>')
    .replace(/__(.+?)__/g,'<u>$1</u>')
    .replace(/\n/g,'<br>');
}

/* Convert contenteditable innerHTML → raw storage format */
function editableToRaw(html){
  let s=html;
  // Line breaks: <br>, </div>, </p>
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/div>/gi,'\n').replace(/<\/p>/gi,'\n');
  // Bold: <strong>, <b>, span with font-weight bold/600+
  s=s.replace(/<(?:strong|b)(?:\s[^>]*)?>([\s\S]*?)<\/(?:strong|b)>/gi,function(_,t){return'**'+t+'**';});
  s=s.replace(/<span[^>]*style="[^"]*font-weight\s*:\s*(?:bold|[6-9]\d{2})[^"]*"[^>]*>([\s\S]*?)<\/span>/gi,function(_,t){return'**'+t+'**';});
  // Italic: <em>, <i>, span with font-style italic
  s=s.replace(/<(?:em|i)(?:\s[^>]*)?>([\s\S]*?)<\/(?:em|i)>/gi,function(_,t){return'*'+t+'*';});
  s=s.replace(/<span[^>]*style="[^"]*font-style\s*:\s*italic[^"]*"[^>]*>([\s\S]*?)<\/span>/gi,function(_,t){return'*'+t+'*';});
  // Underline: <u>, span with text-decoration underline
  s=s.replace(/<u(?:\s[^>]*)?>([\s\S]*?)<\/u>/gi,function(_,t){return'__'+t+'__';});
  s=s.replace(/<span[^>]*style="[^"]*text-decoration\s*:\s*underline[^"]*"[^>]*>([\s\S]*?)<\/span>/gi,function(_,t){return'__'+t+'__';});
  // Strip remaining tags
  s=s.replace(/<[^>]+>/g,'');
  // Decode entities
  s=s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ');
  return s.trim();
}

/* Has any formatting tokens? */
function hasFmt(s){return s&&(/\*\*|^\*[^*]/.test(s)||s.includes('\n'));}

/* ══════════════════════════════════════════════════
   CURSOR — colour-cycling dot + trailing ring + click burst
══════════════════════════════════════════════════ */
(function initCursor(){
  const dot=document.getElementById('cursor-dot');
  const ring=document.getElementById('cursor-ring');
  const fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CLICKABLE='a,button,select,label,summary,[onclick],[role="button"],.btn,.opt,.upload-zone,.img-zoomable,.rte-btn,.toggle .topt';

  let hue=260,mx=-100,my=-100,rx=-100,ry=-100,shown=false;

  /* ---- cursor dot + ring (mouse devices only) ---- */
  if(fine&&dot&&ring){
    document.documentElement.classList.add('has-cursor');
    document.addEventListener('mousemove',e=>{
      mx=e.clientX;my=e.clientY;
      dot.style.transform='translate('+mx+'px,'+my+'px)';
      if(!shown){shown=true;rx=mx;ry=my;dot.style.opacity='1';ring.style.opacity='1';}
      const t=e.target;
      ring.classList.toggle('hover',!!(t.closest&&t.closest(CLICKABLE)));
    });
    document.addEventListener('mouseleave',()=>{dot.style.opacity='0';ring.style.opacity='0';shown=false;});
    document.addEventListener('mousedown',()=>{dot.classList.add('down');ring.classList.add('down');});
    document.addEventListener('mouseup',()=>{dot.classList.remove('down');ring.classList.remove('down');});
  }

  (function loop(now){
    hue=(now*.1)%360;                       /* full colour cycle ≈ 3.6s */
    if(fine&&dot&&ring){
      rx+=(mx-rx)*.15;ry+=(my-ry)*.15;
      ring.style.transform='translate('+rx+'px,'+ry+'px)';
      const col='hsl('+hue.toFixed(0)+',100%,62%)',soft='hsla('+hue.toFixed(0)+',100%,62%,.14)';
      dot.style.setProperty('--c',col);ring.style.setProperty('--c',col);
      dot.style.setProperty('--cs',soft);ring.style.setProperty('--cs',soft);
    }
    requestAnimationFrame(loop);
  })(performance.now());

  /* ---- click / tap burst (all devices) ---- */
  const hsl=(h,l)=>'hsl('+(((h%360)+360)%360).toFixed(0)+',100%,'+(l||62)+'%)';

  function ripple(x,y,h,delay,size){
    const el=document.createElement('div');
    el.style.cssText='position:fixed;pointer-events:none;z-index:9998;border-radius:50%;left:'+x+'px;top:'+y+'px;width:'+size+'px;height:'+size+'px;margin:'+(-size/2)+'px 0 0 '+(-size/2)+'px;border:2px solid '+hsl(h)+';box-shadow:0 0 14px '+hsl(h)+',inset 0 0 10px '+hsl(h)+';opacity:0';
    document.body.appendChild(el);
    const an=el.animate([{transform:'scale(.15)',opacity:.95},{transform:'scale(5)',opacity:0}],{duration:850,delay:delay,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
    an.onfinish=()=>el.remove();
  }
  function flash(x,y,h){
    const el=document.createElement('div');
    el.style.cssText='position:fixed;pointer-events:none;z-index:9997;border-radius:50%;left:'+x+'px;top:'+y+'px;width:90px;height:90px;margin:-45px 0 0 -45px;background:radial-gradient(circle,'+hsl(h,70)+' 0%,transparent 68%);opacity:0';
    document.body.appendChild(el);
    el.animate([{transform:'scale(.2)',opacity:.85},{transform:'scale(1.9)',opacity:0}],{duration:520,easing:'ease-out',fill:'both'}).onfinish=()=>el.remove();
  }
  function spark(x,y,h){
    const el=document.createElement('div');
    const sz=3+Math.random()*6,ang=Math.random()*Math.PI*2,dist=34+Math.random()*70;
    const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist,col=hsl(h);
    const shape=Math.random()<.5?'50%':'2px';
    el.style.cssText='position:fixed;pointer-events:none;z-index:9999;left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;margin:'+(-sz/2)+'px 0 0 '+(-sz/2)+'px;border-radius:'+shape+';background:'+col+';box-shadow:0 0 '+(sz+4)+'px '+col+';opacity:0';
    document.body.appendChild(el);
    const rot=(Math.random()-.5)*360;
    el.animate([
      {transform:'translate(0,0) rotate(0deg) scale(1)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg) scale(0)',opacity:0}
    ],{duration:480+Math.random()*420,easing:'cubic-bezier(.1,.8,.3,1)',fill:'both'}).onfinish=()=>el.remove();
  }
  function burst(x,y){
    const h=hue;
    flash(x,y,h);
    ripple(x,y,h,0,22);
    if(!reduce){
      ripple(x,y,h+60,110,22);
      ripple(x,y,h+120,220,22);
      const n=window.innerWidth<600?12:18;
      for(let i=0;i<n;i++)spark(x,y,h+i*(360/n)*.35);
    }
  }
  window.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    burst(e.clientX,e.clientY);
  },{passive:true});
})();
</script>
