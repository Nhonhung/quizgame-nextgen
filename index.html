<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b14;--surface:#0d1220;--card:#111827;--card2:#161f30;
  --border:#1e2d45;--border2:#2a3f5f;
  --violet:#7c3aed;--cyan:#06b6d4;--emerald:#10b981;
  --amber:#f59e0b;--rose:#ef4444;--pink:#ec4899;
  --text:#e8f0fe;--muted:#64748b;--subtle:#374151;
  --gv:rgba(124,58,237,.5);--gc:rgba(6,182,212,.4);--ge:rgba(16,185,129,.4);
  --gar:rgba(239,68,68,.4);
  --r:16px;--r2:12px;--r3:8px;
  --trans:.22s cubic-bezier(.4,0,.2,1);
  --font:'Be Vietnam Pro',sans-serif;
}
.light{
  --bg:#f0f4ff;--surface:#e4eaf8;--card:#fff;--card2:#f8faff;
  --border:#cbd5e1;--border2:#94a3b8;
  --text:#0f172a;--muted:#64748b;--subtle:#e2e8f0;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;font-size:15px;line-height:1.6}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}

/* ── SCREENS ── */
.screen{width:100%;max-width:580px;animation:screenIn .45s cubic-bezier(.4,0,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.screen-out{animation:screenOut .25s ease forwards!important}
@keyframes screenOut{to{opacity:0;transform:translateY(-16px)}}

/* ── GLASS ── */
.glass{background:rgba(13,18,32,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--r)}
.light .glass{background:rgba(255,255,255,.88)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--r2);border:none;cursor:pointer;font-family:var(--font);font-weight:600;font-size:14px;transition:var(--trans);position:relative;overflow:hidden;white-space:nowrap}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.06);opacity:0;transition:opacity .18s;border-radius:inherit}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.96)!important}
.btn-violet{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 4px 18px var(--gv)}
.btn-violet:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--gv)}
.btn-cyan{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff;box-shadow:0 4px 18px var(--gc)}
.btn-cyan:hover{transform:translateY(-2px)}
.btn-emerald{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 18px var(--ge)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border2)}
.btn-ghost:hover{border-color:var(--violet);background:rgba(124,58,237,.07)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:var(--r3)}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{padding:9px;width:38px;height:38px;border-radius:var(--r3);flex-shrink:0}
.btn-full{width:100%;padding:13px}
.btn:disabled{opacity:.4;pointer-events:none}

/* ── INPUTS ── */
.inp{width:100%;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s}
.light .inp{background:rgba(255,255,255,.85)}
.inp:focus{border-color:var(--violet)}
.inp::placeholder{color:var(--muted)}
select.inp option{background:var(--surface);color:var(--text)}
label.lbl{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}

/* ── ANSWER OPTIONS ── */
.opt{width:100%;padding:13px 16px;border-radius:var(--r2);border:1.5px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;text-align:left;font-family:var(--font);font-size:14px;font-weight:500;color:var(--text);transition:all .2s;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.light .opt{background:rgba(255,255,255,.7)}
.opt:hover:not(.opt-disabled){border-color:var(--violet);background:rgba(124,58,237,.07);transform:translateX(4px)}
.opt.opt-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.12)!important;box-shadow:0 0 18px var(--ge);animation:correctPop .4s cubic-bezier(.34,1.56,.64,1)}
.opt.opt-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.12)!important;animation:shake .38s ease}
.opt.opt-reveal{border-color:var(--emerald)!important;background:rgba(16,185,129,.06)!important}
.opt.opt-elim{opacity:.25;pointer-events:none;text-decoration:line-through}
.opt.opt-disabled{pointer-events:none}
.opt-key{min-width:30px;height:30px;border-radius:7px;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;transition:all .2s;flex-shrink:0}
.opt-correct .opt-key{background:var(--emerald);color:#fff}
.opt-wrong .opt-key{background:var(--rose);color:#fff}
@keyframes correctPop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ── PROGRESS BAR ── */
.pbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ── TIMER CIRCLE ── */
.timer-wrap{position:relative;width:62px;height:62px;flex-shrink:0}
.timer-svg{transform:rotate(-90deg)}
.timer-bg{fill:none;stroke:var(--border);stroke-width:5}
.timer-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;font-size:17px}

/* ── STREAK ── */
.streak{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;transition:all .3s;border:1px solid transparent}
.streak-0{color:var(--muted);border-color:var(--border)}
.streak-1{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.streak-2{color:#f97316;border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.1);animation:gpulse 1.6s infinite}
.streak-3{color:#ef4444;border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1);animation:gpulse .9s infinite}
@keyframes gpulse{0%,100%{box-shadow:0 0 12px rgba(239,68,68,.25)}50%{box-shadow:0 0 24px rgba(239,68,68,.55)}}

/* ── FREEZE ── */
.freeze-overlay{position:absolute;inset:0;border-radius:var(--r);background:rgba(6,182,212,.04);border:2px solid rgba(6,182,212,.35);pointer-events:none;animation:fpulse 2s ease infinite;z-index:5}
@keyframes fpulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── CONFETTI ── */
.conf{position:fixed;pointer-events:none;z-index:999;top:-14px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(110vh) rotate(720deg) scale(.5);opacity:0}}

/* ── SCORE RING ── */
.score-ring{position:relative;width:110px;height:110px;margin:0 auto}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── MISC ── */
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.divider{height:1px;background:var(--border);width:100%}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag-mcq{background:rgba(124,58,237,.2);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}
.tag-tf{background:rgba(6,182,212,.2);color:#67e8f9;border:1px solid rgba(6,182,212,.3)}
.tag-tnl{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}

/* ── SHORT ANSWER INPUT ── */
.sa-wrap{position:relative;margin-top:4px}
.sa-inp{width:100%;padding:14px 50px 14px 16px;border-radius:var(--r2);border:2px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;outline:none;transition:border-color .2s,box-shadow .2s;resize:none;min-height:52px}
.light .sa-inp{background:rgba(255,255,255,.85)}
.sa-inp:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.sa-inp::placeholder{color:var(--muted)}
.sa-inp.sa-correct{border-color:var(--emerald)!important;background:rgba(16,185,129,.1)!important;box-shadow:0 0 16px var(--ge)}
.sa-inp.sa-wrong{border-color:var(--rose)!important;background:rgba(239,68,68,.1)!important;animation:shake .38s ease}
.sa-send{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--trans);font-size:16px}
.sa-send:hover{transform:translateY(-50%) scale(1.08);box-shadow:0 4px 14px var(--gv)}
.sa-send:disabled{opacity:.3;pointer-events:none}
.sa-result-box{margin-top:10px;padding:12px 14px;border-radius:var(--r3);font-size:14px;font-weight:600}
.sa-result-ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.sa-result-bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.sa-img-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:6px;border:1.5px dashed var(--border2);transition:var(--trans)}
.sa-img-label:hover{border-color:var(--cyan);color:var(--cyan)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(124,58,237,.12);color:#a78bfa;border:1px solid rgba(124,58,237,.25)}
.fade-row{animation:fadeRow .32s ease forwards}
@keyframes fadeRow{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── Q TRANSITION ── */
.q-new{animation:qNew .35s cubic-bezier(.4,0,.2,1)}
@keyframes qNew{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}

/* ── RESULT ITEMS ── */
.res-item{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--r3);border:1px solid var(--border)}
.res-ok{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.06)}
.res-bad{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06)}
.res-skip{border-color:var(--border);opacity:.6}

/* ── HINT BUBBLE ── */
.hint-box{padding:10px 14px;border-radius:var(--r3);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);font-size:13px;color:#fbbf24;animation:fadeRow .28s ease}

/* ── TOGGLE ── */
.toggle{display:flex;background:var(--border);border-radius:var(--r3);padding:3px;gap:3px}
.toggle .topt{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--trans);color:var(--muted)}
.toggle .topt.active{background:var(--violet);color:#fff;box-shadow:0 2px 8px var(--gv)}

/* ── UPLOAD ZONE ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r2);padding:22px;text-align:center;cursor:pointer;transition:var(--trans);position:relative}
.upload-zone:hover{border-color:var(--cyan);background:rgba(6,182,212,.04)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:460px;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ── PRACTICE BADGE ── */
.practice-q{padding:12px 14px;border-radius:var(--r3);border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.07);margin-bottom:8px}

/* ── LOGO ── */
.logo-text{font-size:38px;font-weight:800;background:linear-gradient(135deg,#a78bfa 0%,#67e8f9 55%,#6ee7b7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  #app{padding:8px}
  .opt{padding:11px 13px;font-size:13px}
  .glass{border-radius:var(--r2)}
  .logo-text{font-size:30px}
}

/* ── STAT CARD ── */
.stat-card{border-radius:var(--r2);padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:800;font-family:var(--font)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* ── IMAGE LIGHTBOX ── */
.img-zoomable{cursor:zoom-in;transition:opacity .18s,transform .18s;border-radius:var(--r3)}
.img-zoomable:hover{opacity:.88;transform:scale(1.02)}
.lightbox-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease;cursor:zoom-out}
.lightbox-inner{position:relative;max-width:min(92vw,900px);max-height:92vh;animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
.lightbox-img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.7);display:block}
.lightbox-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:var(--rose);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(239,68,68,.5);transition:transform .15s}
.lightbox-close:hover{transform:scale(1.12)}
.lightbox-zoom-bar{position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(13,18,32,.85);border:1px solid var(--border);border-radius:99px;padding:6px 14px}
.lightbox-zoom-bar button{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s}
.lightbox-zoom-bar button:hover{background:rgba(255,255,255,.1)}
.lightbox-zoom-lbl{font-size:13px;font-weight:700;color:var(--muted);min-width:38px;text-align:center}

/* ── RICH TEXT display (bold/italic/newline in questions) ── */
.rich-text strong{font-weight:800;color:var(--text)}
.rich-text em{font-style:italic;color:#c4b5fd}
.rich-text u{text-decoration:underline;text-underline-offset:3px}
.rich-text br{display:block;content:'';margin-top:4px}

/* ── RICH TEXT EDITOR (create screen) ── */
.rte-wrap{position:relative;margin-bottom:9px}
.rte-toolbar{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;align-items:center}
.rte-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;color:var(--text);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;padding:0}
.rte-btn:hover{background:rgba(124,58,237,.15);border-color:var(--violet);color:#a78bfa}
.rte-btn.active{background:rgba(124,58,237,.25);border-color:var(--violet);color:#a78bfa}
.rte-btn-b{font-weight:900}
.rte-btn-i{font-style:italic;font-weight:600}
.rte-btn-u{text-decoration:underline;font-weight:600}
.rte-hint{font-size:11px;color:var(--muted);padding:2px 7px;border-left:2px solid var(--border2)}
.rte-field{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--r3);border:1.5px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s;line-height:1.7;cursor:text;white-space:pre-wrap;word-break:break-word}
.light .rte-field{background:rgba(255,255,255,.85)}
.rte-field:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.rte-field[placeholder]:empty::before{content:attr(placeholder);color:var(--muted);pointer-events:none}
.rte-field strong{font-weight:800;color:var(--text)}
.rte-field em{font-style:italic;color:#c4b5fd}
.rte-field u{text-decoration:underline;text-underline-offset:3px}
.rte-preview{margin-top:5px;padding:7px 11px;border-radius:6px;background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.2);font-size:13px;color:var(--muted);display:none}
.rte-preview.has-fmt{display:block}
.rte-preview-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);margin-bottom:3px}

/* ── CURSOR (colour-cycling dot + trailing ring) ── */
#cursor-dot,#cursor-ring{display:none}
@media (hover:hover) and (pointer:fine){
  html.has-cursor,html.has-cursor *{cursor:none!important}
  html.has-cursor input,html.has-cursor textarea,html.has-cursor [contenteditable],html.has-cursor .rte-field{cursor:text!important}
  #cursor-dot,#cursor-ring{--c:hsl(260,100%,62%);--cs:hsla(260,100%,62%,.12);display:block;position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;opacity:0;will-change:transform}
  #cursor-dot{z-index:10001;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--c);box-shadow:0 0 12px var(--c);transition:opacity .2s,width .2s,height .2s,margin .2s}
  #cursor-ring{z-index:10000;width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--c);transition:opacity .2s,width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),margin .25s cubic-bezier(.2,.8,.2,1),background .25s}
  #cursor-ring.hover{width:64px;height:64px;margin:-32px 0 0 -32px;background:var(--cs)}
  #cursor-ring.down{width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--cs)}
  #cursor-dot.down{width:5px;height:5px;margin:-2.5px 0 0 -2.5px}
}

/* ── BACKGROUND: aurora layer (canvas sits above it) ── */
#bg-aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.34;mix-blend-mode:screen;will-change:transform}
#bg-aurora i:nth-child(1){left:-18vmax;top:-20vmax;background:radial-gradient(circle,#7c3aed,transparent 66%);animation:aur1 24s ease-in-out infinite alternate}
#bg-aurora i:nth-child(2){right:-22vmax;top:8vmax;background:radial-gradient(circle,#06b6d4,transparent 66%);animation:aur2 28s ease-in-out infinite alternate}
#bg-aurora i:nth-child(3){left:12vmax;bottom:-28vmax;background:radial-gradient(circle,#ec4899,transparent 66%);animation:aur3 32s ease-in-out infinite alternate}
@keyframes aur1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(18vmax,10vmax) scale(1.18)}100%{transform:translate(6vmax,22vmax) scale(.92)}}
@keyframes aur2{0%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-20vmax,12vmax) scale(.9)}100%{transform:translate(-8vmax,-6vmax) scale(1.2)}}
@keyframes aur3{0%{transform:translate(0,0) scale(.95)}50%{transform:translate(20vmax,-14vmax) scale(1.2)}100%{transform:translate(-10vmax,-6vmax) scale(1)}}
.light #bg-aurora i{opacity:.2;mix-blend-mode:multiply}
@media(max-width:600px){#bg-aurora i{filter:blur(48px);opacity:.28}}
@media(prefers-reduced-motion:reduce){#bg-aurora i{animation:none}}

/* ── RESPONSIVE / MULTI-DEVICE ── */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
img,video,canvas{max-width:100%}
#app{min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.modal{max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:1100px){
  .logo-text{font-size:46px}
  #app{padding-top:28px;padding-bottom:28px}
}
@media(max-width:600px){
  [style*="grid-template-columns:1fr 1fr;"]{grid-template-columns:1fr!important}
  .modal{padding:18px}
  .stat-num{font-size:22px}
  .stat-card{padding:10px 6px}
  .btn{padding:10px 16px}
}
@media(max-width:480px){
  #app{padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .stat-lbl{font-size:11px}
}
@media(max-width:340px){
  [style*="grid-template-columns:1fr 1fr 1fr"],[style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr 1fr!important}
  .logo-text{font-size:26px}
}
@media(max-height:520px) and (orientation:landscape){
  #app{justify-content:flex-start}
}
@media(pointer:coarse){
  .btn,.opt,.rte-btn,.toggle .topt{min-height:44px}
  input,textarea,select,.rte-field{font-size:16px!important}
}

/* ── CAT MASCOT ── */
.cat-box{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.cat-stage{position:relative;display:block;width:calc(140px*var(--sz,1));margin:0 auto 4px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;border-radius:24px;
  --fur:#fbbf24;--fur-d:#b45309;--belly:#fff3d1;--ear:#f9a8d4;--eye:#1f2937;--acc:#ec4899;--acc-d:#9d174d;--ink:#1f2937;--patch:#f8fafc}
.cat-stage:focus-visible{outline:2px dashed var(--violet);outline-offset:6px}
.cat-stage svg{display:block;width:100%;height:auto;overflow:visible}
.cat-wrap{transform-origin:50% 100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));filter:drop-shadow(0 8px 16px color-mix(in srgb,var(--fur) 42%,transparent));animation:catBob 3.4s ease-in-out infinite}
.cat-wrap.intro{animation:catIn .95s cubic-bezier(.34,1.56,.64,1) both,catBob 3.4s ease-in-out .95s infinite}
.cat-mood,.cat-jumper{transform-origin:50% 88%}
@keyframes catIn{0%{opacity:0;transform:translateY(46px) scale(.25) rotate(-14deg)}60%{opacity:1;transform:translateY(-9px) scale(1.08) rotate(3deg)}100%{opacity:1;transform:none}}
@keyframes catBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* svg parts */
.k-furs{fill:var(--fur);stroke:var(--fur-d);stroke-width:2.6;stroke-linejoin:round}
.k-belly{fill:var(--belly)}
.k-ear{fill:var(--ear)}
.k-eye{fill:var(--eye)}
.k-patch{fill:var(--patch);stroke:none}
.k-accs{fill:var(--acc);stroke:var(--acc-d);stroke-width:2.2;stroke-linejoin:round}
.k-acc{fill:var(--acc)}
.k-line{fill:none;stroke:var(--fur-d);stroke-linecap:round}
.k-stripe{fill:none;stroke:var(--fur-d);stroke-width:3.4;stroke-linecap:round;opacity:.55}
.k-ink{fill:none;stroke:var(--ink);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.k-mouth{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.k-whisk{fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;opacity:.5}
.k-glass{fill:rgba(186,230,253,.22);stroke:var(--acc);stroke-width:3.4}
.k-glassl{fill:none;stroke:var(--acc);stroke-width:3.2;stroke-linecap:round}
.cheek{fill:#fb7185;opacity:.38;transition:opacity .3s}
.tail-o{fill:none;stroke:var(--fur-d);stroke-width:17;stroke-linecap:round}
.tail-i{fill:none;stroke:var(--fur);stroke-width:12.5;stroke-linecap:round}
.tail-r{fill:none;stroke:var(--fur-d);stroke-width:12.5;stroke-dasharray:5 11;opacity:0}
.cat-stage[data-pat=tabby] .tail-r{opacity:.5}
.pat-tabby,.pat-patch,.acc{display:none}
.cat-stage[data-pat=tabby] .pat-tabby,.cat-stage[data-pat=patch] .pat-patch{display:inline}
.cat-stage[data-acc=bow] .acc-bow,.cat-stage[data-acc=hat] .acc-hat,.cat-stage[data-acc=glasses] .acc-glasses,.cat-stage[data-acc=scarf] .acc-scarf,.cat-stage[data-acc=crown] .acc-crown{display:inline}

/* face sets */
.e-open,.e-happy,.e-closed,.e-love,.e-dizzy,.m-smile,.m-open,.m-frown,.m-sad,.m-o,.m-yawn,.m-wave,.brow-angry,.brow-sad,.tear{display:none}
.cat-stage[data-mood=idle] :is(.e-open,.m-smile),
.cat-stage[data-mood=sleepy] :is(.e-open,.m-smile),
.cat-stage[data-mood=sleep] :is(.e-closed,.m-smile),
.cat-stage[data-mood=purr] :is(.e-closed,.m-smile),
.cat-stage[data-mood=love] :is(.e-love,.m-smile),
.cat-stage[data-mood=happy] :is(.e-happy,.m-open),
.cat-stage[data-mood=wave] :is(.e-happy,.m-open),
.cat-stage[data-mood=angry] :is(.e-open,.brow-angry,.m-frown),
.cat-stage[data-mood=sad] :is(.e-open,.brow-sad,.tear,.m-sad),
.cat-stage[data-mood=dizzy] :is(.e-dizzy,.m-wave),
.cat-stage[data-mood=surprised] :is(.e-open,.m-o){display:inline}
.cat-stage:is(.act-yawn,.act-lick,.act-stretch,.act-sneeze,.act-eat,.act-wave,.act-spin,.act-jump,.act-no,.act-sigma,.act-clap)[data-mood] :is(.e-open,.e-happy,.e-closed,.e-love,.e-dizzy,.m-smile,.m-open,.m-frown,.m-sad,.m-o,.m-wave,.brow-angry,.brow-sad,.tear){display:none}
.cat-stage:is(.act-yawn,.act-lick,.act-stretch,.act-sneeze)[data-mood] .e-closed{display:inline}
.cat-stage:is(.act-eat,.act-wave,.act-spin,.act-jump)[data-mood] .e-happy{display:inline}
.cat-stage.act-yawn[data-mood] .m-yawn{display:inline}
.cat-stage:is(.act-lick,.act-stretch)[data-mood] .m-smile{display:inline}
.cat-stage.act-sneeze[data-mood] .m-o{display:inline}
.cat-stage:is(.act-eat,.act-wave,.act-spin,.act-jump)[data-mood] .m-open{display:inline}
.cat-stage:is([data-mood=love],[data-mood=purr],[data-mood=happy]) .cheek{opacity:.72}
.cat-stage[data-mood=angry] .cheek{fill:#ef4444;opacity:.55}

/* base loops */
.g-all{transform-origin:100px 182px;animation:catBreath 3.2s ease-in-out infinite}
@keyframes catBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.026)}}
.cat-tail{transform-origin:142px 164px;animation:catTail 1.9s ease-in-out infinite}
@keyframes catTail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes catTailAngry{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(26deg)}}
.head-follow{transform-origin:100px 118px;transition:transform .25s ease-out}
.cat-head{transform-origin:100px 118px;animation:catHead 6s ease-in-out infinite}
@keyframes catHead{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.cat-ear-l{transform-origin:68px 52px;animation:catEarL 5.2s infinite}
.cat-ear-r{transform-origin:132px 52px;animation:catEarR 6.4s infinite}
@keyframes catEarL{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-13deg)}94%{transform:rotate(3deg)}97%{transform:rotate(-5deg)}}
@keyframes catEarR{0%,80%,100%{transform:rotate(0)}83%{transform:rotate(13deg)}86%{transform:rotate(-3deg)}89%{transform:rotate(4deg)}}
.cat-stage[data-mood=idle]:hover .cat-ear-l{animation:none;transform:rotate(6deg) scale(1.05)}
.cat-stage[data-mood=idle]:hover .cat-ear-r{animation:none;transform:rotate(-6deg) scale(1.05)}
.eye{transform-box:fill-box;transform-origin:center;animation:catBlink 4.6s infinite}
@keyframes catBlink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
.pupil-g{transition:transform .12s ease-out}
.e-open{transform-box:fill-box;transform-origin:50% 60%}
.arm-l{transform-origin:80px 130px}
.arm-r{transform-origin:120px 130px}
.beat{transform-box:fill-box;transform-origin:center;animation:catBeat .8s ease-in-out infinite}
@keyframes catBeat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.95)}}
.spiral{transform-box:fill-box;transform-origin:center;animation:catSpinS 1s linear infinite}
@keyframes catSpinS{to{transform:rotate(360deg)}}
.tear-d{animation:catTear 1.8s ease-in infinite}
.tear-d.t2{animation-delay:.9s}
@keyframes catTear{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(16px);opacity:0}}
.m-sad{transform-box:fill-box;transform-origin:center;animation:catTremble .3s linear infinite}
@keyframes catTremble{0%,100%{transform:translateX(-.6px)}50%{transform:translateX(.6px)}}

/* moods */
.cat-stage[data-mood=happy] .cat-mood{animation:catHop 1s ease-in-out infinite}
@keyframes catHop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-8px) scale(.97,1.05)}60%{transform:translateY(0) scale(1.04,.95)}}
.cat-stage[data-mood=love] .cat-mood{animation:catFloat 2.2s ease-in-out infinite}
@keyframes catFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.cat-stage[data-mood=purr] .cat-mood{animation:catVibe .09s linear infinite}
@keyframes catVibe{0%,100%{transform:translateX(-.9px)}50%{transform:translateX(.9px)}}
.cat-stage[data-mood=dizzy] .cat-mood{animation:catSway 1.1s ease-in-out infinite}
@keyframes catSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cat-stage[data-mood=sleep] .cat-mood{transform:translateY(5px) scaleY(.96)}
.cat-stage[data-mood=sad] .cat-mood{transform:translateY(4px) scale(.98)}
.cat-stage[data-mood=angry] .cat-mood{transform:scale(1.05)}
.cat-stage[data-mood=surprised] .cat-mood{animation:catPop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes catPop{0%{transform:scale(1)}40%{transform:translateY(-14px) scale(1.1)}100%{transform:scale(1.05)}}
.cat-stage[data-mood=happy] .cat-tail,.cat-stage[data-mood=love] .cat-tail,.cat-stage[data-mood=wave] .cat-tail{animation-duration:.5s}
.cat-stage[data-mood=angry] .cat-tail{animation:catTailAngry .3s ease-in-out infinite}
.cat-stage[data-mood=sad] .cat-tail{animation:none;transform:rotate(18deg)}
.cat-stage[data-mood=sleep] .cat-tail,.cat-stage[data-mood=sleepy] .cat-tail{animation-duration:4.5s}
.cat-stage[data-mood=surprised] .cat-tail{animation:none;transform:rotate(-26deg) scale(1.12)}
.cat-stage[data-mood=sleep] .cat-head{animation:catNod 3.6s ease-in-out infinite}
@keyframes catNod{0%,100%{transform:translateY(6px) rotate(6deg)}50%{transform:translateY(9px) rotate(2deg)}}
.cat-stage[data-mood=sleepy] .cat-head{animation:catNodS 2.4s ease-in-out infinite}
@keyframes catNodS{0%,100%{transform:translateY(0) rotate(-2deg)}55%{transform:translateY(5px) rotate(5deg)}70%{transform:translateY(1px) rotate(0)}}
.cat-stage[data-mood=sad] .cat-head{animation:none;transform:translateY(7px) rotate(5deg)}
.cat-stage[data-mood=angry] .cat-head{animation:catShake .16s linear infinite}
@keyframes catShake{0%,100%{transform:translateX(-1.4px)}50%{transform:translateX(1.4px)}}
.cat-stage[data-mood=dizzy] .cat-head{animation:catWobble 1s ease-in-out infinite}
@keyframes catWobble{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.cat-stage[data-mood=love] .cat-head{animation:catWobble 1.8s ease-in-out infinite}
.cat-stage[data-mood=angry] .cat-ear-l{animation:none;transform:rotate(-26deg)}
.cat-stage[data-mood=angry] .cat-ear-r{animation:none;transform:rotate(26deg)}
.cat-stage[data-mood=sad] .cat-ear-l{animation:none;transform:rotate(-16deg) translateY(3px)}
.cat-stage[data-mood=sad] .cat-ear-r{animation:none;transform:rotate(16deg) translateY(3px)}
.cat-stage[data-mood=sleep] .cat-ear-l{animation:none;transform:rotate(-8deg)}
.cat-stage[data-mood=sleep] .cat-ear-r{animation:none;transform:rotate(8deg)}
.cat-stage[data-mood=surprised] .cat-ear-l{animation:none;transform:rotate(7deg) scale(1.06)}
.cat-stage[data-mood=surprised] .cat-ear-r{animation:none;transform:rotate(-7deg) scale(1.06)}
.cat-stage[data-mood=sleepy] .e-open{transform:scaleY(.5)}
.cat-stage[data-mood=angry] .e-open{transform:scaleY(.82)}
.cat-stage[data-mood=surprised] .e-open{transform:scale(1.14)}
.cat-stage[data-mood=surprised] .pupil{transform-box:fill-box;transform-origin:center;transform:scale(.6)}
.cat-stage[data-mood=sad] .pupil{transform-box:fill-box;transform-origin:center;transform:scale(1.12)}
.cat-stage[data-mood=happy] .arm-l{animation:catFlapL .5s ease-in-out infinite alternate}
.cat-stage[data-mood=happy] .arm-r{animation:catFlapR .5s ease-in-out infinite alternate}
@keyframes catFlapL{from{transform:rotate(0)}to{transform:rotate(16deg)}}
@keyframes catFlapR{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
.cat-stage[data-mood=surprised] .arm-l{transform:rotate(34deg)}
.cat-stage[data-mood=surprised] .arm-r{transform:rotate(-34deg)}
.cat-stage[data-mood=purr] .arm-l{animation:catKnead .45s ease-in-out infinite alternate}
.cat-stage[data-mood=purr] .arm-r{animation:catKnead .45s ease-in-out infinite alternate-reverse}
@keyframes catKnead{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.cat-stage[data-mood=wave] .arm-r{animation:catWave .55s ease-in-out infinite}
@keyframes catWave{0%,100%{transform:rotate(-146deg)}50%{transform:rotate(-112deg)}}

/* acts (one-shot, defined after moods so they win) */
.cat-stage.act-jump .cat-jumper{animation:catJump .75s cubic-bezier(.3,1.3,.5,1)}
@keyframes catJump{0%{transform:none}25%{transform:translateY(-28px) scale(.94,1.08)}55%{transform:translateY(0) scale(1.1,.88)}78%{transform:translateY(-6px) scale(.98,1.03)}100%{transform:none}}
.cat-stage.act-spin .cat-jumper{animation:catSpinJ .9s ease-in-out}
@keyframes catSpinJ{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-26px) rotate(150deg) scale(1.06)}70%{transform:translateY(-8px) rotate(300deg)}100%{transform:translateY(0) rotate(360deg)}}
.cat-stage.act-stretch .cat-jumper{animation:catStretch 1.8s ease-in-out}
@keyframes catStretch{0%{transform:none}20%{transform:scale(1.1,.88)}55%{transform:scale(.9,1.16) translateY(-2px)}80%{transform:scale(1.04,.97)}100%{transform:none}}
.cat-stage.act-sneeze .cat-jumper{animation:catSneeze .95s ease-out}

<script>
/* ── Hộp thoại tự làm ── */
function _uiDialog(msg,buttons){
  const bg=document.createElement('div');
  bg.className='modal-bg';bg.style.zIndex='9500';
  const box=document.createElement('div');box.className='modal';box.style.maxWidth='380px';
  const p=document.createElement('p');
  p.style.cssText='font-size:15px;line-height:1.6;white-space:pre-line;margin-bottom:18px';
  p.textContent=msg;
  const row=document.createElement('div');row.style.cssText='display:flex;gap:10px';
  box.appendChild(p);box.appendChild(row);bg.appendChild(box);document.body.appendChild(bg);
  buttons.forEach(b=>{
    const el=document.createElement('button');
    el.className='btn btn-full '+b.cls;el.textContent=b.label;
    el.onclick=()=>{bg.remove();if(b.fn)b.fn();};
    row.appendChild(el);
  });
}
window.uiConfirm=(msg,onYes)=>_uiDialog(msg,[{label:'Hủy',cls:'btn-ghost'},{label:'Đồng ý',cls:'btn-violet',fn:onYes}]);
window.alert=(msg)=>{_uiDialog(String(msg),[{label:'OK',cls:'btn-violet'}]);};

/* ── SOUND ENGINE ── */
const AC = window.AudioContext ? new (window.AudioContext||window.webkitAudioContext)() : null;
function tone(freq,type='sine',dur=.15,vol=.22){
  if(!AC)return;
  try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
const SFX={
  click:()=>tone(480,'sine',.07,.16),
  correct:()=>{tone(523,'sine',.1);setTimeout(()=>tone(659,'sine',.1),95);setTimeout(()=>tone(784,'sine',.17),190)},
  wrong:()=>{tone(200,'sawtooth',.11,.26);setTimeout(()=>tone(155,'sawtooth',.16,.26),100)},
  streak:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.12),i*72)),
  tick:()=>tone(880,'square',.05,.09),
  whoosh:()=>{tone(300,'sine',.05,.09);setTimeout(()=>tone(750,'sine',.07,.07),45)},
  end:()=>[523,587,659,698,784].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.14),i*95)),
};
SFX.meow=()=>{
  if(!AC)return;
  try{
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='triangle';o.connect(g);g.connect(AC.destination);
    o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(920,t+.12);
    o.frequency.exponentialRampToValueAtTime(420,t+.4);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.42);
    o.start(t);o.stop(t+.45);
  }catch(e){}
};

/* ── STORAGE ENGINE ── */
const _QS_MEM = { list: null };
const QS = {
  _load() {
    if (_QS_MEM.list !== null) return;
    try {
      const idxRaw = localStorage.getItem('qs_index');
      if (idxRaw) {
        const idx = JSON.parse(idxRaw);
        const list = [];
        for (const meta of idx) {
          try {
            const raw = localStorage.getItem(meta.key);
            if (raw) {
              list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: JSON.parse(raw) });
            } else if (meta._noStorage) {
              list.push({ name: meta.name, timePerQ: meta.timePerQ || 20, hints: meta.hints || 3, questions: [] });
            } else {

            }
          } catch (_) {}
        }
        _QS_MEM.list = list;
        return;
      }
    } catch (_) {}
    try {
      const raw = localStorage.getItem('question_sets');
      _QS_MEM.list = raw ? JSON.parse(raw) : [];
    } catch { _QS_MEM.list = []; }
  },
  getAll() { this._load(); return _QS_MEM.list; },
  _persist() {
    const list = _QS_MEM.list;
    try {
      const oldIdx = JSON.parse(localStorage.getItem('qs_index') || '[]');
      for (const m of oldIdx) { try { localStorage.removeItem(m.key); } catch (_) {} }
    } catch (_) {}
    for (let k = 0; k < 20; k++) { try { localStorage.removeItem('qs_' + k); } catch (_) {} }
    const idx = [];
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const key = 'qs_' + i;
      const meta = { name: s.name, timePerQ: s.timePerQ || 20, hints: s.hints || 3, key };
      let saved = false;
      try {
        localStorage.setItem(key, JSON.stringify(s.questions));
        saved = true;
      } catch (_) {
        try {
          const lite = s.questions.map(q => {
            const c = Object.assign({}, q);
            if (c.image && c.image.length > 200) c.image = '';
            if (c.optImages) c.optImages = c.optImages.map(x => (x && x.length > 200) ? '' : x);
            if (c.subQuestions) c.subQuestions = c.subQuestions.map(sq => {
              const sc = Object.assign({}, sq);
              if (sc.image && sc.image.length > 200) sc.image = '';
              return sc;
            });
            return c;
          });
          localStorage.setItem(key, JSON.stringify(lite));
          saved = true;
        } catch (_2) {}
      }
      idx.push(meta);
      if (!saved) idx[idx.length - 1]._noStorage = true;
    }
    try { localStorage.setItem('qs_index', JSON.stringify(idx)); } catch (_) {}
    try { localStorage.removeItem('question_sets'); } catch (_) {}
  },
  upsert(ns) {
    this._load();
    const ei = _QS_MEM.list.findIndex(s => s.name === ns.name);
    if (ei >= 0) _QS_MEM.list[ei] = ns; else _QS_MEM.list.push(ns);
    this._persist();
  },
  remove(i) {
    this._load();
    _QS_MEM.list.splice(i, 1);
    this._persist();
  },
  update(i, ns) {
    this._load();
    _QS_MEM.list[i] = ns;
    this._persist();
  },
};

(function initBG(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,particles=[],shoots=[],nextShoot=1500;
  const mouse={x:-9999,y:-9999,sx:-9999,sy:-9999,on:false,pull:false,pullUntil:0};
  const waves=[];
  const _noBg=t=>t&&t.closest&&t.closest('.cat-stage,.cp,input,textarea,select,[contenteditable],.rte-field,.modal,#modal-bg');
  const orbHues=[265,190,160,330];
  const orbs=orbHues.map(h=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:180+Math.random()*140,h}));
  function newParticle(){
    const vx=(Math.random()-.5)*.42,vy=(Math.random()-.5)*.42;
    return{x:Math.random()*W,y:Math.random()*H,bvx:vx,bvy:vy,vx,vy,r:Math.random()*2+.6,a:.35+Math.random()*.65,
      tw:Math.random()*6.28,ts:.0008+Math.random()*.0018,tint:Math.random()<.22,ho:Math.random()*80-40};
  }
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const want=Math.round(Math.min(110,Math.max(32,W*H/15000)));
    while(particles.length<want)particles.push(newParticle());
    if(particles.length>want)particles.length=want;
    particles.forEach(p=>{if(p.x>W)p.x=Math.random()*W;if(p.y>H)p.y=Math.random()*H;});
  }
  resize();window.addEventListener('resize',resize);
  window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(!mouse.on){mouse.on=true;mouse.sx=mouse.x;mouse.sy=mouse.y;}},{passive:true});
  window.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')mouse.on=false;},{passive:true});
  document.addEventListener('mouseleave',()=>{mouse.on=false;mouse.pull=false;});
  window.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button===1)return;
    mouse.x=e.clientX;mouse.y=e.clientY;mouse.on=true;
    if(mouse.sx<-999){mouse.sx=mouse.x;mouse.sy=mouse.y;}
    if(e.pointerType==='mouse'&&e.button===2){
      /* chuột phải: HÚT các hạt về con trỏ (giữ để hút liên tục) */
      if(_noBg(e.target))return;
      mouse.pull=true;mouse.pullUntil=performance.now()+1100;
      waves.push({x:e.clientX,y:e.clientY,t:0,pull:true});
      particles.forEach(p=>{
        const dx=e.clientX-p.x,dy=e.clientY-p.y,d=Math.hypot(dx,dy);
        if(d<360&&d>1){const f=(1-d/360)*5;p.vx+=dx/d*f;p.vy+=dy/d*f;}
      });
      return;
    }
    /* chuột trái / chạm: ĐẨY các hạt ra */
    waves.push({x:e.clientX,y:e.clientY,t:0,pull:false});
    particles.forEach(p=>{
      const dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.hypot(dx,dy);
      if(d<280&&d>1){const f=(1-d/280)*7;p.vx+=dx/d*f;p.vy+=dy/d*f;}
    });
  },{passive:true});
  const _endPull=()=>{mouse.pull=false;};
  window.addEventListener('pointerup',e=>{if(e.button===2)_endPull();},{passive:true});
  window.addEventListener('pointercancel',_endPull,{passive:true});
  window.addEventListener('blur',_endPull);
  window.addEventListener('contextmenu',e=>{if(e.defaultPrevented)return;const t=e.target;if(t&&t.closest&&t.closest('input,textarea,[contenteditable],.rte-field'))return;e.preventDefault();});
  function spawnShoot(){
    const fromLeft=Math.random()<.5;
    const sp=9+Math.random()*6, ang=(Math.PI/180)*(25+Math.random()*20);
    shoots.push({x:fromLeft?Math.random()*W*.5:W*.5+Math.random()*W*.5,y:-20+Math.random()*H*.35,
      vx:Math.cos(ang)*sp*(fromLeft?1:-1),vy:Math.sin(ang)*sp,len:90+Math.random()*90,life:1});
  }
  function draw(now){
    ctx.clearRect(0,0,W,H);
    const isDark=!document.body.classList.contains('light');
    const hs=(now*.008)%360;
    if(mouse.on){
      mouse.sx+=(mouse.x-mouse.sx)*.09;mouse.sy+=(mouse.y-mouse.sy)*.09;
      const g=ctx.createRadialGradient(mouse.sx,mouse.sy,0,mouse.sx,mouse.sy,280);
      g.addColorStop(0,`hsla(${hs},100%,60%,${isDark?.13:.07})`);g.addColorStop(1,`hsla(${hs},100%,60%,0)`);
      ctx.fillStyle=g;ctx.fillRect(mouse.sx-280,mouse.sy-280,560,560);
    }
    const pulling=mouse.pull||now<mouse.pullUntil;
    if(pulling&&mouse.on){
      const t=(now%900)/900;
      for(let k=0;k<3;k++){
        const u=(t+k/3)%1,rr=150*(1-u)+10;
        ctx.beginPath();ctx.arc(mouse.x,mouse.y,rr,0,Math.PI*2);
        ctx.strokeStyle=`hsla(${hs},100%,${isDark?72:48}%,${(isDark?.5:.35)*u})`;ctx.lineWidth=1.6;ctx.stroke();
      }
      const g2=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,70);
      g2.addColorStop(0,`hsla(${hs},100%,70%,${isDark?.35:.2})`);g2.addColorStop(1,`hsla(${hs},100%,70%,0)`);
      ctx.fillStyle=g2;ctx.fillRect(mouse.x-70,mouse.y-70,140,140);
    }
    for(let i=waves.length-1;i>=0;i--){
      const w=waves[i];w.t+=.035;
      if(w.t>=1){waves.splice(i,1);continue;}
      const rr=w.pull?170*(1-w.t):200*w.t+8,al=(isDark?.55:.35)*(w.pull?w.t:1-w.t);
      ctx.beginPath();ctx.arc(w.x,w.y,Math.max(rr,2),0,Math.PI*2);
      ctx.strokeStyle=`hsla(${hs},100%,${isDark?72:48}%,${al})`;ctx.lineWidth=2;ctx.stroke();
    }
    orbs.forEach(o=>{
      o.x+=o.vx;o.y+=o.vy;
      if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;
      if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;
      const hh=(o.h+hs)%360;
      const g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,`hsla(${hh},85%,60%,${isDark?.12:.07})`);g.addColorStop(1,`hsla(${hh},85%,60%,0)`);
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    for(const p of particles){
      let relax=.025;
      if(pulling&&mouse.on){
        /* hút: kéo về con trỏ, xoáy nhẹ, chậm dần khi tới gần */
        const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
        if(d<380&&d>.5){
          const f=(1-d/380)*.9;
          p.vx+=dx/d*f+(-dy/d)*f*.18;p.vy+=dy/d*f+(dx/d)*f*.18;
          if(d<70){p.vx*=.88;p.vy*=.88;}
          const sp=Math.hypot(p.vx,p.vy);if(sp>13){p.vx*=13/sp;p.vy*=13/sp;}
          relax=.004;
        }
      }else if(mouse.on){
        const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
        if(d<130&&d>.5){const f=(1-d/130)*.55;p.vx+=dx/d*f;p.vy+=dy/d*f;}
      }
      p.vx+=(p.bvx-p.vx)*relax;p.vy+=(p.bvy-p.vy)*relax;
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const tw=.6+.4*Math.sin(now*p.ts+p.tw);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.85+.3*tw),0,Math.PI*2);
      if(p.tint)ctx.fillStyle=`hsla(${(hs+p.ho+360)%360},95%,${isDark?72:45}%,${p.a*tw*(isDark?.85:.55)})`;
      else ctx.fillStyle=isDark?`rgba(180,200,255,${p.a*.55*tw})`:`rgba(80,100,140,${p.a*.3*tw})`;
      ctx.fill();
    }
    ctx.lineWidth=.7;
    for(let i=0;i<particles.length;i++){
      const a=particles[i];
      for(let j=i+1;j<particles.length;j++){
        const b=particles[j],dx=a.x-b.x,dy=a.y-b.y;
        if(dx>120||dx<-120||dy>120||dy<-120)continue;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<120){
          const al=isDark?.18*(1-d/120):.1*(1-d/120);
          ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);

        }
      }
      if(mouse.on){
        const dx=a.x-mouse.x,dy=a.y-mouse.y,d=Math.hypot(dx,dy);

        }

        if(s.life<=0||s.x<-200||s.x>W+200||s.y>H+200)shoots.splice(i,1);
      }
      ctx.lineCap='butt';
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* ── Màu ── */
function _h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function _r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function _mix(a,b,t){const x=_h2r(a),y=_h2r(b);return _r2h(x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t);}
function _lum(h){const c=_h2r(h);return(.2126*c[0]+.7152*c[1]+.0722*c[2])/255;}
function catStyle(){
  const f=CAT.fur,l=_lum(f),dk=l<.3;
  const fd=dk?_mix(f,'#ffffff',.4):_mix(f,'#2a1305',.5);
  return'--fur:'+f+';--fur-d:'+fd+';--belly:'+_mix(f,'#ffffff',.62)+';--ear:'+_mix(f,'#f472b6',.6)+';--eye:'+CAT.eye+';--acc:'+CAT.acc+';--acc-d:'+_mix(CAT.acc,'#000000',.4)+';--ink:'+(dk?'#f1f5f9':'#1f2937')+';--patch:'+(l>.75?'#f59e0b':(dk?'#f1f5f9':'#fffaf0'))+';--sz:'+catSize().toFixed(3);
}

/* ── Âm thanh ── */
function _noise(d,vol,hp){
  const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=hp||2500;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
}
function catVoice(k){
  if(!CAT.sound||!AC)return;
  try{
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,p=.92+Math.random()*.22;
    const osc=(type,pts,d,vol)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.connect(g);g.connect(AC.destination);
      o.frequency.setValueAtTime(pts[0][1]*p,t+pts[0][0]);
      for(let i=1;i<pts.length;i++)o.frequency.exponentialRampToValueAtTime(pts[i][1]*p,t+pts[i][0]);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.start(t);o.stop(t+d+.03);
    };
    switch(k){
      case'meow':osc('triangle',[[0,520],[.12,920],[.4,420]],.42,.2);break;
      case'mew':osc('triangle',[[0,780],[.09,1250],[.26,760]],.28,.16);break;
      case'squeak':osc('square',[[0,1100],[.08,1900]],.14,.07);break;
      case'sad':osc('triangle',[[0,640],[.2,520],[.65,300]],.7,.17);break;
      case'yawn':osc('sine',[[0,330],[.45,560],[1.1,260]],1.2,.14);break;
      case'hiss':_noise(.5,.12,3000);break;
      case'sneeze':_noise(.16,.12,1800);osc('triangle',[[.12,900],[.3,500]],.32,.1);break;
      case'sigma':osc('sine',[[0,150],[.5,58]],.95,.26);osc('triangle',[[.05,300],[.6,110]],.7,.07);break;
      case'clap':for(let i=0;i<8;i++)setTimeout(()=>{if(!CAT.sound||!AC)return;_noise(.07,.22,1300);_noise(.03,.12,3500);},600+i*400);break;
      case'munch':_noise(.07,.1,900);osc('triangle',[[0,300],[.06,200]],.09,.12);break;
    }
  }catch(e){}
}
function catPurrStart(){
  if(!CAT.sound||!AC)return null;
  try{
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=82;f.type='lowpass';f.frequency.value=380;
    lfo.type='sine';lfo.frequency.value=24;lg.gain.value=.04;
    g.gain.value=.001;lfo.connect(lg);lg.connect(g.gain);
    o.connect(f);f.connect(g);g.connect(AC.destination);
    g.gain.setTargetAtTime(.06,AC.currentTime,.12);
    o.start();lfo.start();
    return()=>{try{g.gain.setTargetAtTime(.0001,AC.currentTime,.08);o.stop(AC.currentTime+.4);lfo.stop(AC.currentTime+.4);}catch(e){}};
  }catch(e){return null;}
}

function _spiral(cx,cy,r){let d='M'+cx+' '+cy;for(let a=.3;a<=Math.PI*5;a+=.35){const rr=r*a/(Math.PI*5);d+=' L'+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return d;}
function _heart(cx,cy,s){return'M'+cx+' '+(cy+8*s)+' C'+(cx-14*s)+' '+(cy-2*s)+' '+(cx-10*s)+' '+(cy-13*s)+' '+cx+' '+(cy-6*s)+' C'+(cx+10*s)+' '+(cy-13*s)+' '+(cx+14*s)+' '+(cy-2*s)+' '+cx+' '+(cy+8*s)+'Z';}
const _TP=[[134,166],[160,172],[179,160],[186,138],[180,116],[166,104]];
const TAIL_PTS=(function(){
  const P=[_TP[0]].concat(_TP,[_TP[_TP.length-1]]),out=[_TP[0]],N=3;
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    for(let k=1;k<=N;k++){
      const t=k/N,t2=t*t,t3=t2*t;
      out.push([0,1].map(c=>.5*((2*p1[c])+(-p0[c]+p2[c])*t+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*t2+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*t3)));
    }
  }
  return out;
})();
function _tail(cls){
  let s='';
  for(let i=TAIL_PTS.length-2;i>=0;i--){
    const a=TAIL_PTS[i],b=TAIL_PTS[i+1];
    s='<g class="tj" style="transform-origin:'+a[0].toFixed(1)+'px '+a[1].toFixed(1)+'px;animation-delay:'+(-(i*.06)).toFixed(2)+'s"><path class="'+cls+'" d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+'"/>'+s+'</g>';
  }
  return s;
}

/* ── Markup ── */
function catStage(){return document.querySelector('.cat-stage');}
function catPick(a){return a[Math.floor(Math.random()*a.length)];}
const _catReduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function catHTML(){
  catInit();
  const intro=Date.now()-CAT._intro>8000;
  if(intro){
    CAT._intro=Date.now();
    const g=catGreeting();
    if(CAT.mood==='idle'&&g.m!=='idle')CAT.mood=g.m;
    CAT._nextAct=Date.now()+10500;CAT._nextTip=Date.now()+26000;
    setTimeout(()=>{
      if(!catStage())return;
      if(!_catReduce&&CAT.mood==='idle')catAct('wave',false,true);
      else if(CAT.mood==='happy')catFx('star',3);
      catSay(g.t,6500);
      catVoice('mew');
    },1250);
  }
  const M=MOODS[CAT.mood]||MOODS.idle;
  return`<div class="cat-box">
  <div class="cat-stage" data-mood="${CAT.mood}" data-acc="${CAT.accessory}" data-pat="${CAT.pat}" data-gender="${CAT.gender}" data-full="${catFullState()}" style="${catStyle()}" tabindex="0" role="button" aria-label="Chú mèo ${esc(CAT.name)} — bấm để cho ăn hoặc chọc, chuột phải để cài đặt" onpointerdown="catDown(event)" onpointerenter="catHover(event)" onkeydown="catKey(event)" oncontextmenu="return catCtx(event)">
    <div class="cat-wrap${intro?' intro':''}"><div class="cat-mood"><div class="cat-jumper">${catSVG()}</div></div></div>
    <div class="cat-bubble"></div>
  </div>
  <div class="cat-tag"><span class="cat-tag-e">${M.e}</span><span class="cat-tag-n">${esc(CAT.name)}</span><span class="cat-lv">Lv ${catLevel()+1}</span><button type="button" class="cat-gear" onclick="catPanel(!document.documentElement.classList.contains('cat-cp-open'))" title="Cài đặt mèo (hoặc bấm chuột phải vào mèo)" aria-label="Cài đặt mèo">⚙️</button></div>
  <div class="cat-xp" title="Tiến độ lớn lên"><i style="width:${Math.round(catProg()*100)}%"></i></div>
  <div class="cat-hint">Bấm: cho ăn / chọc · Giữ: vuốt ve · Chuột phải: cài đặt</div>
  </div>`;
}

/* ── Áp dụng trạng thái ── */
function catApply(){
  const M=MOODS[CAT.mood]||MOODS.idle;
  document.querySelectorAll('.cat-stage').forEach(st=>{
    st.setAttribute('style',catStyle());
    st.dataset.mood=CAT.mood;st.dataset.acc=CAT.accessory;st.dataset.pat=CAT.pat;st.dataset.gender=CAT.gender;st.dataset.full=catFullState();
    st.setAttribute('aria-label','Chú mèo '+CAT.name+' — bấm để cho ăn hoặc chọc, chuột phải để cài đặt');
  });
  document.querySelectorAll('.cat-tag-e').forEach(e=>e.textContent=M.e);
  document.querySelectorAll('.cat-tag-n').forEach(e=>e.textContent=CAT.name);
  document.querySelectorAll('.cat-lv').forEach(e=>e.textContent='Lv '+(catLevel()+1));
  document.querySelectorAll('.cat-xp i').forEach(e=>e.style.width=Math.round(catProg()*100)+'%');
  catPanelSync();
}

/* ── Lời thoại ── */
function catSay(t,ms){
  if(!CAT.notes||!t)return;
  const b=document.querySelector('.cat-bubble');if(!b)return;
  b.textContent=t;b.classList.remove('show');void b.offsetWidth;
  b.style.setProperty('--bd',(ms||3400)+'ms');b.classList.add('show');
  CAT._sayAt=Date.now();
}

/* ── Hạt hiệu ứng ── */
function catFx(kind,n,col){
  const st=catStage();if(!st||document.hidden)return;
  if(st.querySelectorAll('.cat-p').length>40)return;
  const W=st.offsetWidth||140,k=W/140,list=FX[kind]||FX.heart;
  for(let i=0;i<n;i++){
    const el=document.createElement('span');el.className='cat-p';el.textContent=catPick(list);
    el.style.fontSize=(kind==='zzz'?14+Math.random()*8:kind==='crumb'?9+Math.random()*6:13+Math.random()*9)*Math.max(.85,k)+'px';
    if(col)el.style.color=col;
    const delay=i*(kind==='star'||kind==='crumb'?30:110);let a;
    const T='translate(-50%,-50%) ';
    if(kind==='star'||kind==='drop'||kind==='crumb'){
      el.style.left='50%';el.style.top=(kind==='drop'?'58%':kind==='crumb'?'64%':'36%');st.appendChild(el);
      const ang=kind==='drop'?Math.PI*(.2+Math.random()*.6):kind==='crumb'?Math.PI*(.05+Math.random()*.9):Math.random()*Math.PI*2;
      const d=(kind==='crumb'?18+Math.random()*28:30+Math.random()*50)*k;
      const dx=Math.cos(ang)*d,dy=Math.sin(ang)*d+(kind==='drop'||kind==='crumb'?16*k:0);
      a=el.animate([{transform:T+'scale(.3)',opacity:0},{transform:T+'translate('+dx*.6+'px,'+dy*.6+'px) scale(1.1)',opacity:1,offset:.3},{transform:T+'translate('+dx+'px,'+dy+'px) scale(.4)',opacity:0}],{duration:kind==='crumb'?620:760,delay:delay,easing:'cubic-bezier(.1,.8,.3,1)',fill:'both'});
    }else if(kind==='zzz'){
      el.style.left='62%';el.style.top='22%';st.appendChild(el);
      a=el.animate([{transform:T+'scale(.5)',opacity:0},{transform:T+'translate('+8*k+'px,'+-14*k+'px) scale(1)',opacity:1,offset:.3},{transform:T+'translate('+26*k+'px,'+-42*k+'px) scale(1.25)',opacity:0}],{duration:1900,delay:delay,easing:'ease-out',fill:'both'});
    }else{
      el.style.left=(50+(Math.random()-.5)*50)+'%';el.style.top=(26+Math.random()*10)+'%';st.appendChild(el);
      const dx=(Math.random()-.5)*44*k,dy=(46+Math.random()*30)*k;
      a=el.animate([{transform:T+'scale(.5)',opacity:0},{transform:T+'translate('+dx*.4+'px,'+-dy*.5+'px) scale(1)',opacity:1,offset:.25},{transform:T+'translate('+dx+'px,'+-dy+'px) scale(1.1)',opacity:0}],{duration:1000+Math.random()*600,delay:delay,easing:'ease-out',fill:'both'});
    }
    a.onfinish=()=>el.remove();
  }
}

/* ── Cho ăn ── */
function catFoodFly(F){
  const st=catStage();if(!st)return;
  const W=st.offsetWidth,H=st.offsetHeight;
  const f=document.createElement('span');f.className='cat-p';f.textContent=F.e;
  f.style.cssText='left:90%;top:-4%;z-index:6;font-size:'+(24*Math.max(.9,W/140))+'px';
  st.appendChild(f);
  const base='translate(-50%,-50%) translate('+(-W*.4)+'px,'+(H*.68)+'px)';
  f.animate([{transform:'translate(-50%,-50%) rotate(-25deg) scale(1)',opacity:1},{transform:base+' rotate(8deg) scale(1)',opacity:1}],{duration:850,easing:'cubic-bezier(.35,.1,.5,1)',fill:'forwards'}).onfinish=()=>{
    f.animate([{transform:base+' rotate(8deg) scale(1)'},{transform:base+' rotate(-6deg) scale(.04)'}],{duration:1800,easing:'steps(5,end)',fill:'forwards'}).onfinish=()=>f.remove();
  };
  for(let i=1;i<=5;i++)setTimeout(()=>{catFx('crumb',3,F.c);catVoice('munch');},850+i*360-60);
}
function catFeedFood(k){
  const F=FOODS[k];if(!F||!catStage()||CAT._eating)return;
  catMenu(false);
  CAT._last=Date.now();
  if(CAT.mood==='sleep'||CAT.mood==='sleepy')catSetMood('idle',{silent:true});
  if(CAT.full>=92){catAct('no',true,true);catSay(catPick(FULL_LINES),3200);catVoice('sad');return;}
  CAT._eating=true;
  catAct('eat',true,true);
  catSay(catPick(F.say),2800);
  catFoodFly(F);
  setTimeout(()=>catEatDone(k),2750);
}
function catEatDone(k){
  CAT._eating=false;
  const F=FOODS[k],old=catLevel();
  CAT.xp+=F.xp;CAT.full=Math.min(100,CAT.full+F.f);CAT.fed=(CAT.fed||0)+1;
  catSave();
  const nl=catLevel();
  catApply();
  if(!catStage())return;
  if(nl>old)catLevelUp(nl);
  else{catSay(catPick(F.done),3200);catFx('heart',3);catVoice('mew');catTemp('happy',2200,true);}
}
function catLevelUp(l){
  catAct('spin',true,true);
  catFx('star',10);
  catSay('Lên cấp '+(l+1)+'! Mình đã thành "'+LV[l].n+'" rồi 🎉',5600);
  try{if(CAT.sound&&typeof SFX!=='undefined'&&SFX.streak)SFX.streak();}catch(e){}
}

/* ── Hành động ── */
function catClearAct(st){
  st=st||catStage();
  if(st)[...st.classList].forEach(c=>{if(c.indexOf('act-')===0)st.classList.remove(c);});
  CAT._act=null;
}
function catAct(name,force,silent){
  const st=catStage(),A=ACTS[name];if(!st||!A)return false;
  if(CAT._act&&!force)return false;
  clearTimeout(CAT._actT);catClearAct(st);
  CAT._act=name;st.classList.add('act-'+name);
  CAT._actT=setTimeout(()=>{const s=catStage();if(s)s.classList.remove('act-'+name);CAT._act=null;},A.dur);
  if(!silent){const s=typeof A.say==='function'?A.say():(A.say&&A.say.length?catPick(A.say):null);if(s)catSay(s);}
  if(A.v)catVoice(A.v);
  if(A.fx)catFx(A.fx[0],A.fx[1]);
  return true;
}

/* ── Trạng thái (mood) ── */
function catSetMood(m,o){
  o=o||{};if(!MOODS[m])return;
  clearTimeout(CAT._tmpT);CAT._tmpT=0;
  catClearAct();
  CAT.mood=m;
  if(!o.temp)CAT._prev=null;
  CAT._autoSlept=(m==='sleep'||m==='sleepy')?!!o.auto:false;
  if(!o.auto)CAT._last=Date.now();
  const st=catStage();
  if(st&&(m==='sleep'||m==='purr'||m==='dizzy')){
    st.querySelectorAll('.pupil-g').forEach(p=>p.style.transform='');
    st.querySelectorAll('.ear-fl,.ear-fr,.head-follow').forEach(p=>p.style.transform='');
  }
  catApply();
  const M=MOODS[m];
  if(!o.silent){catSay(catPick(M.say));if(M.v)catVoice(M.v);}
  if(m==='surprised')catFx('exc',1);
  if(m==='angry')catFx('anger',1);
  if(m==='love')catFx('heart',4);
  if(m==='happy'&&!o.silent)catFx('star',4);
}
function catTemp(m,ms,silent){
  if(CAT._prev===null)CAT._prev=CAT.mood;
  catSetMood(m,{temp:true,silent:!!silent});
  clearTimeout(CAT._tmpT);
  CAT._tmpT=setTimeout(()=>{const p=CAT._prev;CAT._prev=null;catSetMood(p||'idle',{silent:true});},ms);
}

/* ── Menu bấm chuột trái (cho ăn / chọc) ── */
function catMenu(open,view){
  const st=catStage();if(!st)return;
  let m=st.querySelector('.cat-menu');
  clearTimeout(CAT._menuT);
  if(!open){
    CAT._menuOn=false;
    if(m){m.classList.remove('show');setTimeout(()=>m.remove(),200);}
    return;
  }
  if(!m){
    m=document.createElement('div');m.className='cat-menu';m.setAttribute('role','menu');
    m.addEventListener('pointerdown',e=>e.stopPropagation());
    m.addEventListener('click',catMenuClick);
    m.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();});
    st.appendChild(m);
  }
  if(view==='food'){
    m.innerHTML='<div class="cat-menu-t">Độ no '+Math.round(CAT.full)+'%</div><div class="fg">'+Object.keys(FOODS).map(k=>'<button type="button" class="fd" data-m="food" data-v="'+k+'"><span>'+FOODS[k].e+'</span><span>'+FOODS[k].n+'</span></button>').join('')+'</div><button type="button" class="bk" data-m="back">‹ Quay lại</button>';
  }else{
    m.innerHTML='<button type="button" data-m="feed"><span>🍖</span>Cho ăn</button><button type="button" data-m="poke"><span>👉</span>Chọc</button>';
  }
  void m.offsetWidth;m.classList.add('show');CAT._menuOn=true;
  CAT._menuT=setTimeout(()=>catMenu(false),8000);
}
function catMenuClick(e){
  const b=e.target.closest('[data-m]');if(!b)return;
  e.stopPropagation();CAT._last=Date.now();
  const m=b.dataset.m;
  if(m==='feed')catMenu(true,'food');
  else if(m==='back')catMenu(true,'main');
  else if(m==='poke'){catMenu(false);catPoke();}
  else if(m==='food')catFeedFood(b.dataset.v);
}

/* ── Chạm / giữ / chuột phải ── */
window.catClick=function(){
  CAT._last=Date.now();
  if(CAT.mood==='sleep'||CAT.mood==='sleepy'){
    const auto=CAT._autoSlept;
    catTemp('surprised',1200);
    if(auto)CAT._prev='idle';
    catSay('Hả?! Meo! 🙀 Giật cả mình!');
    return;
  }
  if(CAT._menuOn){catMenu(false);return;}
  catMenu(true,'main');
  catAct('earperk',false,true);
  catSay(catPick(['Bạn muốn làm gì với mình nè? 🐾','Cho mình ăn hay chọc mình đây? 😼','Meo? Chọn đi nào~']),3000);
};
window.catPoke=function(){
  const now=Date.now();
  CAT._last=now;
  CAT._clicks=CAT._clicks.filter(t=>now-t<2600);CAT._clicks.push(now);
  const n=CAT._clicks.length;
  if(CAT.mood==='sleep'||CAT.mood==='sleepy'){catClick();return;}
  if(n>=4&&CAT.mood!=='dizzy'){CAT._clicks=[];catTemp('dizzy',3200);catSay('Chọc nhiều quá… chóng mặt rồi 😵‍💫',3200);return;}
  if(n===3&&CAT.mood==='idle'){catTemp('angry',1600,true);catSay('Gừ! Đừng chọc nữa mà! 💢');catVoice('hiss');return;}
  if(n===2){catTemp('happy',1500,true);catSay('Nhột quá đi! 😹');catVoice('mew');catAct('jump',true,true);return;}
  catAct(catPick(CLICK_ACTS),true);
};
window.catKey=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();catClick();}};
window.catHover=function(e){
  if(e&&e.pointerType&&e.pointerType!=='mouse')return;
  const now=Date.now();
  if(now-CAT._sayAt>14000&&!CAT._menuOn&&CAT.mood==='idle'&&!CAT._act)catSay(catPick(HOVER_LINES),2800);
};
window.catCtx=function(e){
  e.preventDefault();e.stopPropagation();
  if(CAT._ptr==='touch'||CAT._holding)return false;
  catMenu(false);catPanel(true);
  if(CAT.mood==='idle')catSay(catPick(['Muốn đổi kiểu cho mình hả? 🎀','Chỉnh sửa mình nè~ ✨','Thay áo mới cho mình đi! 👗']),2600);
  return false;
};
window.catDown=function(e){
  CAT._ptr=e.pointerType||'mouse';
  if(e.pointerType==='mouse'&&e.button!==0)return;
  CAT._last=Date.now();
  CAT._down={x:e.clientX,y:e.clientY};
  clearTimeout(CAT._holdT);
  CAT._holdT=setTimeout(()=>{if(!CAT._down)return;CAT._holding=true;catPetStart();},430);
};
function catPetStart(){
  catMenu(false);
  if(CAT._prev===null)CAT._prev=CAT.mood;
  catSetMood('purr',{temp:true,silent:true});
  catSay(catPick(['Purrrr… 💜','Gừ gừ… sướng quá~','Mmm… vuốt nữa đi~']),2600);
  CAT._purr=catPurrStart();
  catFx('heart',3);
}
function catPetEnd(){
  if(CAT._purr){CAT._purr();CAT._purr=null;}
  const p=CAT._prev;CAT._prev=null;
  catSetMood(p||'idle',{silent:true});
  catSay(catPick(['Thích quá đi~ 😻','Cảm ơn nha! 💕','Meo~ vuốt nữa nha']));
  catFx('heart',4);catVoice('mew');
}
function catUp(e){
  if(!CAT._down)return;
  const d=CAT._down;CAT._down=null;clearTimeout(CAT._holdT);
  if(CAT._holding){CAT._holding=false;catPetEnd();return;}
  if(e.type==='pointercancel')return;
  const st=catStage(),t=document.elementFromPoint(e.clientX,e.clientY);
  if(st&&t&&st.contains(t)&&!t.closest('.cat-menu')&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<14)catClick();
}

/* ── Nhìn theo con trỏ (mắt, đầu, tai) ── */
function catLook(e){
  CAT._last=Date.now();
  if(CAT._down&&!CAT._holding&&Math.hypot(e.clientX-CAT._down.x,e.clientY-CAT._down.y)>14)clearTimeout(CAT._holdT);
  const st=catStage();if(!st)return;
  const m=CAT.mood;if(m==='sleep'||m==='purr'||m==='dizzy')return;
  const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.42;
  const dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/180);
  const px=(dx/d*k*2.6).toFixed(2),py=(dy/d*k*2.2).toFixed(2);
  st.querySelectorAll('.pupil-g').forEach(p=>{p.style.transform='translate('+px+'px,'+py+'px)';});
  const hf=st.querySelector('.head-follow');
  if(hf)hf.style.transform='rotate('+(dx/d*k*5).toFixed(1)+'deg) translate('+(dx/d*k*2.5).toFixed(1)+'px,'+(dy/d*k*1.2).toFixed(1)+'px)';
  const er=(dx/d*k*7).toFixed(1),es=(1+(dy<0?k*.06:0)).toFixed(3);
  st.querySelectorAll('.ear-fl,.ear-fr').forEach(p=>{p.style.transform='rotate('+er+'deg) scale('+es+')';});
}

/* ── Vòng lặp tự động ── */
function catTick(){
  CAT._tick++;
  const now=Date.now(),dt=(now-CAT._decayAt)/60000;CAT._decayAt=now;
  CAT.full=Math.max(0,CAT.full-dt);
  if(CAT._tick%25===0){catSave();catPanelSync();}
  const st=catStage();if(!st||document.hidden)return;
  const m=CAT.mood,n=CAT._tick;
  if(st.dataset.full!==catFullState())st.dataset.full=catFullState();
  if(m==='love')catFx('heart',1);
  else if(m==='sleep'){if(n%2===0)catFx('zzz',1);}
  else if(m==='angry'){if(n%3===0)catFx('anger',1);}
  else if(m==='happy'){if(n%3===0)catFx('star',2);}
  else if(m==='purr'){if(n%2===0)catFx('heart',1);}
  else if(m==='dizzy'){if(n%2===0)catFx('dizzy',1);}
  else if(m==='wave'){if(n%4===0)catFx('note',1);}
  if(m==='sleepy'&&CAT._autoSlept&&now-CAT._sleepAt>7000){catSetMood('sleep',{auto:true});return;}
  if(m!=='idle'||!CAT.auto||_catReduce)return;
  if(CAT._holding||CAT._down||CAT._act||CAT._eating||CAT._menuOn)return;
  if(now-CAT._last>38000){catSetMood('sleepy',{auto:true});CAT._sleepAt=now;return;}
  if(CAT.full<22&&now>CAT._nextHungry){CAT._nextHungry=now+34000;catAct('grumble',true);return;}
  if(now>CAT._nextAct){CAT._nextAct=now+5000+Math.random()*5500;catAct(catPick(AUTO_ACTS));return;}
  if(now>CAT._nextTip&&now-CAT._sayAt>6000){
    CAT._nextTip=now+24000+Math.random()*16000;
    let pool=CAT_TIPS.concat(catTimeNotes(),catTimeNotes());
    const sn=catStreakNote();if(sn)pool.push(sn);
    if(CAT.full<40)pool=pool.concat(catHungerNotes(),catHungerNotes());
    catSay(catPick(pool),4400);
  }
}
function catInit(){
  if(CAT._inited)return;CAT._inited=true;
  window.addEventListener('pointermove',catLook,{passive:true});
  window.addEventListener('pointerup',catUp);
  window.addEventListener('pointercancel',catUp);
  window.addEventListener('pointerdown',e=>{
    CAT._last=Date.now();
    const t=e.target&&e.target.closest?e.target:null;
    if(CAT._menuOn&&t&&!t.closest('.cat-stage'))catMenu(false);
    if(CAT._autoSlept&&t&&!t.closest('.cat-stage')&&!t.closest('.cp')){
      catSetMood('idle',{silent:true});catSay('Hửm? 😺 Dậy rồi nè~');
    }
  },{passive:true});
  window.addEventListener('keydown',e=>{CAT._last=Date.now();if(e.key==='Escape'){catMenu(false);catPanelClose();}},{passive:true});
  setInterval(catTick,800);
}

function catPanelBuild(){
  const el=document.createElement('aside');

}
function catPanelSync(){
  if(!_cp)return;
  const M=MOODS[CAT.mood]||MOODS.idle,l=catLevel(),nx=LV[l+1];
  _cp.querySelector('#cp-av').textContent=M.e;

  const mark=(a,cur)=>_cp.querySelectorAll('[data-a='+a+']').forEach(b=>b.classList.toggle('on',b.dataset.v.toLowerCase()===String(cur).toLowerCase()));
  mark('fur',CAT.fur);mark('eye',CAT.eye);mark('acc',CAT.acc);mark('pat',CAT.pat);mark('gender',CAT.gender);mark('accessory',CAT.accessory);
  const set=(id,v)=>{const x=_cp.querySelector('#'+id);if(x&&document.activeElement!==x)x.value=v;};
  set('cp-name',CAT.name);set('cp-fur-c',CAT.fur);set('cp-eye-c',CAT.eye);set('cp-acc-c',CAT.acc);

const _LOOK_LINES=['Màu mới hả? Đẹp quá! ✨','Ôi, mình xinh hơn rồi nè 😻','Hợp với mình ghê~ 💖','Thích lắm luôn! 🐾'];
function catPanelClick(e){
  const b=e.target.closest('[data-a],[data-t]');if(!b||!_cp.contains(b))return;
  CAT._last=Date.now();
  if(b.dataset.t){
    const k=b.dataset.t;CAT[k]=!CAT[k];
    if(k==='sound'&&CAT.sound)catVoice('mew');
    if(k==='auto'&&CAT.auto){CAT._nextAct=Date.now()+2500;CAT._last=Date.now();}
    if(k==='notes'&&CAT.notes)catSay('Mình nói chuyện lại được rồi nè~ 🐾');
    catSave();catPanelSync();return;
  }
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case'close':catPanel(false);return;
    case'mood':catSetMood(v);break;
    case'act':catAct(v,true);break;
    case'feed':catFeedFood(v);break;
    case'reset':catReset();return;
    case'resetgrow':catResetGrow();return;
    case'fur':CAT.fur=v;break;
    case'eye':CAT.eye=v;break;
    case'acc':CAT.acc=v;break;
    case'pat':CAT.pat=v;break;
    case'gender':CAT.gender=v;if(CAT.accessory==='none'||CAT.accessory==='bow')CAT.accessory=v==='female'?'bow':'none';break;
    case'accessory':CAT.accessory=v;break;
  }
  if(a==='fur'||a==='eye'||a==='acc'||a==='pat'||a==='accessory'||a==='gender'){
    catSave();catApply();
    if(a==='accessory'&&v!=='none')catFx('star',3);
    catSay(catPick(_LOOK_LINES),2600);
  }
  catPanelSync();
}
function catPanelInput(e){
  const t=e.target;CAT._last=Date.now();

  else if(t.id==='cp-fur-c')CAT.fur=t.value;
  else if(t.id==='cp-eye-c')CAT.eye=t.value;
  else if(t.id==='cp-acc-c')CAT.acc=t.value;
  else return;
  catSave();catApply();
}
function catReset(){
  ['fur','eye','acc','pat','accessory','gender','name','auto','sound','notes'].forEach(k=>{CAT[k]=CAT_DEF[k];});

  catSave();catApply();

window.uploadFile=(e)=>{
  const f=e.target.files[0];if(!f)return;
  e.target.value='';
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext!=='json'){alert('❌ Chỉ nhận file .json!\nFile bạn chọn: '+f.name);return;}
  const r=new FileReader();
  r.onload=ev=>{
    let data;
    try{data=JSON.parse(String(ev.target.result).replace(/^\uFEFF/,''));}
    catch(pe){alert('❌ File JSON không hợp lệ!\nLỗi: '+pe.message);return;}
    const isObj=data&&typeof data==='object'&&!Array.isArray(data);
    const raw=Array.isArray(data)?data:(isObj&&Array.isArray(data.questions)?data.questions:[]);
    const qs=raw.filter(q=>q&&typeof q==='object'&&String(q.question||'').trim()).map((q,qi)=>({...q,id:q.id||qi+1}));
    if(!qs.length){alert('Không tìm thấy câu hỏi hợp lệ trong file!');return;}
    const setName=(isObj&&data.name)?String(data.name):f.name.replace(/\.json$/i,'').replace(/_/g,' ');
    QS.upsert({name:setName,questions:qs,timePerQ:(isObj&&data.timePerQ)||20,hints:(isObj&&data.hints)||3});
    SFX.correct();
    alert('✔️ Đã thêm bộ đề "'+setName+'" ('+qs.length+' câu)\nvào menu chơi!');
    render();
  };
  r.onerror=()=>alert('❌ Không thể đọc file. Vui lòng thử lại.');
  r.readAsText(f,'UTF-8');
};

/* ══════════════════════════════════════════════════
   RICH TEXT EDITOR — FIXED
   ══════════════════════════════════════════════════ */
let _rteSavedRange = null;

function _rteSaveSelection(){
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const r = sel.getRangeAt(0);
  const node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  if (node && node.closest && node.closest('[contenteditable="true"]')) {
    _rteSavedRange = r.cloneRange();
  }
}
function _rteRestoreSelection(){
  if (!_rteSavedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  try { sel.addRange(_rteSavedRange); } catch(_){}
}
function _rteExec(el, cmd){
  if (document.activeElement !== el) el.focus();
  _rteRestoreSelection();
  try { document.execCommand('styleWithCSS', false, false); } catch(_){}
  try { document.execCommand(cmd, false, null); } catch(_){}
}
function _rteInsertBreak(){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const br = document.createElement('br');
  range.insertNode(br);
  range.setStartAfter(br);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function _rteUpdateToolbar(el){
  const wrap = el.closest('.rte-wrap');
  if (!wrap) return;
  ['bold','italic','underline'].forEach(c => {
    let st = false;
    try { st = document.queryCommandState(c); } catch(_){}
    const btn = wrap.querySelector('.rte-btn[data-cmd="'+c+'"]');
    if (btn) btn.classList.toggle('active', st);
  });
}

/* Flush innerHTML → raw markdown-like text; update preview */
function rteFlush(id, qi){
  const el = document.getElementById(id);
  if (!el) return;
  const raw = editableToRaw(el.innerHTML);
  if (CR.questions[qi]) CR.questions[qi].question = raw;
  const prev = document.getElementById(id + '-prev');
  if (prev){
    const span = prev.querySelector('.rich-text');
    if (span) span.innerHTML = richText(raw);
    prev.className = 'rte-preview' + (hasFmt(raw) ? ' has-fmt' : '');
  }
}

function _attachRTE(el, i, id){
  const save = () => { _rteSaveSelection(); _rteUpdateToolbar(el); };
  el.addEventListener('mouseup', save);
  el.addEventListener('keyup', save);
  el.addEventListener('focus', () => _rteUpdateToolbar(el));
  el.addEventListener('input', () => { _rteSaveSelection(); rteFlush(id, i); _rteUpdateToolbar(el); });

  /* Keyboard shortcuts — dùng e.key.toLowerCase() để nhận cả B/I/U */
  el.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey){
      const k = (e.key || '').toLowerCase();
      if (k === 'b'){ e.preventDefault(); _rteExec(el,'bold');      rteFlush(id,i); _rteUpdateToolbar(el); return; }
      if (k === 'i'){ e.preventDefault(); _rteExec(el,'italic');    rteFlush(id,i); _rteUpdateToolbar(el); return; }
      if (k === 'u'){ e.preventDefault(); _rteExec(el,'underline'); rteFlush(id,i); _rteUpdateToolbar(el); return; }
    }
  });

  /* Paste: chỉ nhận text thuần, tránh rác HTML */
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
    rteFlush(id, i);
  });

  /* Toolbar buttons — dùng addEventListener thay vì inline */
  const wrap = el.closest('.rte-wrap');
  if (!wrap) return;
  wrap.querySelectorAll('.rte-btn[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      _rteSaveSelection();
      const cmd = btn.getAttribute('data-cmd');
      if (cmd === 'br') _rteInsertBreak();
      else _rteExec(el, cmd);
      rteFlush(id, i);
      _rteUpdateToolbar(el);
    });
  });
}

function injectRTE(i, val){
  const slot = document.getElementById('cr-q-rte-' + i);
  if (!slot) return;
  const id = 'rte-q-' + i;
  slot.innerHTML = `
    <div class="rte-wrap">
      <div class="rte-toolbar">
        <button type="button" class="rte-btn rte-btn-b" data-cmd="bold"      title="In đậm (Ctrl+B)"><b>B</b></button>

      </div>

}

function _doExportJSON(ns){
  const blob=new Blob([JSON.stringify(ns,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(ns.name||'bode').replace(/\s+/g,'_')+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

function startGame(questions,config){
  clearInterval(S.timerID);
  Object.assign(S,{
    questions,config,idx:0,score:0,streak:0,
    timeLeft:config.timePerQ,frozen:false,answered:false,
    selected:null,eliminated:[],hintsLeft:config.hintLimit?config.hints:999,
    startTime:Date.now(),elapsed:0,results:[],currentHint:'',
    bestStreak:LS.get('best_streak',0),practiceList:[],
    saInput:'',saImg:'',saCorrect:false,
    tfSubAnswers:[],

  setScreen('game');
}
